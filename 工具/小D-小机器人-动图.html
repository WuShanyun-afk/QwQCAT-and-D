<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小D · 小机器人（会眨眼 · 动图帧）</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="1220" height="1220"></canvas>
<script>
/* 用 ?frame=N 画第 N 帧（N = 0..FRAMES-1），出图脚本逐帧截屏再拼 APNG */
const q = new URLSearchParams(location.search);
const FRAMES = Math.max(1, +(q.get('frames') || 36));
const frame = Math.max(0, +(q.get('frame') || 0));
const phase = frame / FRAMES;                      // 0..1 循环相位
const TAU = Math.PI * 2;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.scale(2, 2);                                   /* 610×610 坐标系，2 倍出图 */

const HEAD1 = '#b3a6ff';
const HEAD2 = '#6c5ce7';
const BODY1 = '#9a8bf8';
const BODY2 = '#4b3fc4';
const SCREEN1 = '#242242';
const SCREEN2 = '#0e0d22';
const CYAN = '#7ef7ff';
const GOLD1 = '#fff6b0';
const GOLD2 = '#ffb703';

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- 动画参数 ---------- */
const bob = Math.sin(TAU * phase) * 2.6;                       /* 上下轻轻浮 */
const glowPulse = .5 + .5 * Math.sin(TAU * phase);             /* 天线呼吸 0..1 */
/* 眨眼：循环里的第 26/27/28 帧（其余帧睁眼）。26/28 半闭，27 全闭 */
let blink = 0;                                                 /* 0 睁眼 → 1 全闭 */
if (frame % FRAMES === 26) blink = .55;
else if (frame % FRAMES === 27) blink = 1;
else if (frame % FRAMES === 28) blink = .5;

ctx.save();
ctx.translate(0, bob);

/* ---------- 脑袋后面的柔光 ---------- */
const glow = ctx.createRadialGradient(305, 300, 40, 305, 300, 250);
glow.addColorStop(0, 'rgba(150,128,255,.22)');
glow.addColorStop(1, 'rgba(150,128,255,0)');
ctx.fillStyle = glow;
ctx.beginPath();
ctx.arc(305, 300, 250, 0, TAU);
ctx.fill();

/* ---------- 天线 ---------- */
ctx.strokeStyle = '#8f7ff5';
ctx.lineWidth = 11;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(305, 168);
ctx.lineTo(305, 96);
ctx.stroke();

/* 金球（随呼吸变亮变大一点点） */
ctx.save();
ctx.shadowColor = 'rgba(255,200,80,.9)';
ctx.shadowBlur = 30 + 18 * glowPulse;
const ballR = 22 + 1.6 * glowPulse;
const ball = ctx.createRadialGradient(296, 70, 5, 305, 80, 28);
ball.addColorStop(0, GOLD1);
ball.addColorStop(1, GOLD2);
ctx.fillStyle = ball;
ctx.beginPath();
ctx.arc(305, 80, ballR, 0, TAU);
ctx.fill();
ctx.restore();
ctx.fillStyle = 'rgba(255,255,255,' + (.7 + .25 * glowPulse) + ')';
ctx.beginPath();
ctx.arc(297, 71, 6.5, 0, TAU);
ctx.fill();

/* ---------- 身体 ---------- */
const bodyG = ctx.createLinearGradient(0, 385, 0, 545);
bodyG.addColorStop(0, BODY1);
bodyG.addColorStop(1, BODY2);
ctx.fillStyle = bodyG;
rr(212, 392, 186, 132, 54);
ctx.fill();

/* 小脚 */
ctx.fillStyle = '#4338a8';
rr(238, 506, 62, 26, 13); ctx.fill();
rr(310, 506, 62, 26, 13); ctx.fill();

/* 小手 */
ctx.fillStyle = '#8f7ff5';
ctx.beginPath(); ctx.arc(196, 470, 21, 0, TAU); ctx.fill();
ctx.beginPath(); ctx.arc(414, 470, 21, 0, TAU); ctx.fill();

/* 胸口小胸章 */
ctx.fillStyle = 'rgba(20,18,42,.6)';
ctx.beginPath(); ctx.arc(305, 458, 27, 0, TAU); ctx.fill();
ctx.strokeStyle = CYAN;
ctx.lineWidth = 8;
ctx.lineJoin = 'round';
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(292, 458);
ctx.lineTo(302, 469);
ctx.lineTo(320, 447);
ctx.stroke();

/* ---------- 脑袋 ---------- */
const headG = ctx.createLinearGradient(0, 150, 0, 425);
headG.addColorStop(0, HEAD1);
headG.addColorStop(1, HEAD2);
ctx.fillStyle = headG;
rr(128, 152, 354, 268, 88);
ctx.fill();

/* 头顶高光 */
ctx.save();
ctx.globalAlpha = .35;
ctx.fillStyle = '#e7e2ff';
ctx.beginPath();
ctx.ellipse(232, 196, 62, 27, -0.22, 0, TAU);
ctx.fill();
ctx.restore();

/* ---------- 屏幕脸 ---------- */
const scrG = ctx.createRadialGradient(305, 250, 30, 305, 300, 190);
scrG.addColorStop(0, SCREEN1);
scrG.addColorStop(1, SCREEN2);
ctx.fillStyle = scrG;
rr(168, 192, 274, 192, 62);
ctx.fill();

/* ---------- 眼睛（会眨） ---------- */
for (const x of [250, 360]) {
  if (blink > 0.9) {
    /* 全闭：一条弯弯的青色眼线（笑眼） */
    ctx.save();
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 16;
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.arc(x, 290, 21, Math.PI * 1.18, Math.PI * 1.82);
    ctx.stroke();
    ctx.restore();
  } else {
    ctx.save();
    ctx.translate(x, 272);
    ctx.scale(1, 1 - blink * .92);   /* 半闭：眼睛压扁 */
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 20;
    ctx.fillStyle = CYAN;
    ctx.beginPath();
    ctx.arc(0, 0, 27, 0, TAU);
    ctx.fill();
    ctx.restore();
    if (blink < .3) {
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.beginPath();
      ctx.arc(x - 8, 262, 9, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + 8, 281, 4, 0, TAU);
      ctx.fill();
    }
  }
}

/* ---------- 微笑 ---------- */
ctx.save();
ctx.shadowColor = CYAN;
ctx.shadowBlur = 14;
ctx.strokeStyle = CYAN;
ctx.lineWidth = 9;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(276, 326);
ctx.quadraticCurveTo(305, 352, 334, 326);
ctx.stroke();
ctx.restore();

/* ---------- 腮红 ---------- */
ctx.save();
ctx.globalCompositeOperation = 'lighter';
ctx.fillStyle = 'rgba(255,105,165,.72)';
ctx.beginPath(); ctx.ellipse(214, 336, 27, 15, 0, 0, TAU); ctx.fill();
ctx.beginPath(); ctx.ellipse(396, 336, 27, 15, 0, 0, TAU); ctx.fill();
ctx.restore();

/* ---------- 耳朵上的小螺丝 ---------- */
ctx.fillStyle = '#5b4fd0';
for (const s of [-1, 1]) {
  ctx.beginPath();
  ctx.arc(305 + s * 150, 292, 9, 0, TAU);
  ctx.fill();
}

/* ---------- 小星星（跟着呼吸一闪一闪） ---------- */
function star(cx, cy, r, rot, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 === 0 ? r : r * 0.44;
    ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}
const tw = .55 + .45 * glowPulse;
star(516, 214, 11, 0.3, 'rgba(126,247,255,' + tw + ')');
star(548, 178, 6, 0.9, 'rgba(126,247,255,' + (.5 * tw + .3) + ')');
star(92, 250, 8, -0.2, 'rgba(185,167,255,' + (.7 * tw + .2) + ')');

ctx.restore();
</script>
</body>
</html>
