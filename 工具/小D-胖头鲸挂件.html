<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小D · 胖头鲸鱼角色图（610×610 透明）</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="1220" height="1220"></canvas>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.scale(2, 2);            /* 610×610 的坐标系，2 倍分辨率出图 */

const INK   = '#2e2a4d';
const BODY1 = '#8d88dc';
const BODY2 = '#625cb8';
const FIN   = '#6f69c4';
const BELLY = '#e3e7fc';
const IRIS  = '#4563a8';
const BLUSH = 'rgba(255,150,178,.55)';
const WATER = '#bfe0ff';

ctx.lineJoin = 'round';
ctx.lineCap = 'round';

/* ================= 尾巴（先画，藏身体后面） ================= */
ctx.fillStyle = FIN;
ctx.strokeStyle = INK;
ctx.lineWidth = 9;

/* 尾柄 */
ctx.beginPath();
ctx.moveTo(420, 415);
ctx.quadraticCurveTo(500, 435, 545, 500);
ctx.quadraticCurveTo(480, 480, 415, 462);
ctx.closePath();
ctx.fill(); ctx.stroke();

/* 上尾鳍 */
ctx.beginPath();
ctx.moveTo(542, 494);
ctx.quadraticCurveTo(565, 438, 606, 430);
ctx.quadraticCurveTo(578, 476, 556, 508);
ctx.closePath();
ctx.fill(); ctx.stroke();

/* 下尾鳍 */
ctx.beginPath();
ctx.moveTo(548, 506);
ctx.quadraticCurveTo(576, 540, 570, 580);
ctx.quadraticCurveTo(536, 548, 520, 516);
ctx.closePath();
ctx.fill(); ctx.stroke();

/* ================= 身体 ================= */
const g = ctx.createRadialGradient(228, 170, 40, 300, 350, 320);
g.addColorStop(0, BODY1);
g.addColorStop(1, BODY2);
ctx.beginPath();
ctx.ellipse(300, 320, 208, 194, 0, 0, Math.PI * 2);
ctx.fillStyle = g;
ctx.fill();
ctx.strokeStyle = INK;
ctx.lineWidth = 10;
ctx.stroke();

/* 肚皮 */
ctx.beginPath();
ctx.ellipse(300, 400, 138, 100, 0, 0, Math.PI * 2);
ctx.fillStyle = BELLY;
ctx.fill();
ctx.save();
ctx.globalAlpha = .3;
ctx.strokeStyle = '#b9c3ee';
ctx.lineWidth = 3.5;
ctx.stroke();
ctx.restore();

/* 头顶高光 */
ctx.save();
ctx.globalAlpha = .5;
ctx.beginPath();
ctx.ellipse(222, 182, 56, 28, -0.45, 0, Math.PI * 2);
ctx.fillStyle = '#c9c5f2';
ctx.fill();
ctx.restore();

/* ================= 小呆毛 ================= */
ctx.strokeStyle = INK;
ctx.lineWidth = 10;
ctx.beginPath();
ctx.moveTo(325, 130);
ctx.bezierCurveTo(345, 74, 408, 54, 440, 88);
ctx.stroke();
ctx.fillStyle = INK;
ctx.beginPath();
ctx.arc(440, 88, 7, 0, Math.PI * 2);
ctx.fill();

/* ================= 小胸鳍（画在身体前面） ================= */
for (const s of [-1, 1]) {
  ctx.save();
  ctx.translate(300 + s * 124, 452);
  ctx.rotate(s * 0.42);
  ctx.beginPath();
  ctx.ellipse(0, 0, 56, 30, 0, 0, Math.PI * 2);
  ctx.fillStyle = FIN;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 8.5;
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* ================= 眼睛 ================= */
for (const s of [-1, 1]) {
  const ex = 300 + s * 92, ey = 296;
  ctx.beginPath();
  ctx.ellipse(ex, ey, 39, 45, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(ex + s * 3, ey + 4, 30, 35, 0, 0, Math.PI * 2);
  ctx.fillStyle = IRIS;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(ex + s * 3, ey + 8, 18, 23, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#1e2440';
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(ex - 11, ey - 12, 10.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex + 11, ey + 17, 5, 0, Math.PI * 2);
  ctx.fill();
}

/* ================= 腮红 ================= */
for (const s of [-1, 1]) {
  ctx.beginPath();
  ctx.ellipse(300 + s * 142, 364, 32, 19, s * 0.12, 0, Math.PI * 2);
  ctx.fillStyle = BLUSH;
  ctx.fill();
}

/* ================= 嘴 ================= */
ctx.strokeStyle = INK;
ctx.lineWidth = 8;
ctx.beginPath();
ctx.moveTo(276, 360);
ctx.quadraticCurveTo(300, 386, 324, 360);
ctx.stroke();

/* ================= 头顶喷水（小水珠一串，往上冒） ================= */
ctx.fillStyle = WATER;
const drops = [[206, 148, 11], [196, 120, 8.5], [210, 96, 6.5], [232, 116, 4.5]];
for (const [x, y, r] of drops) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
/* 水珠底下一小段水面 */
ctx.strokeStyle = 'rgba(191,224,255,.85)';
ctx.lineWidth = 6;
ctx.beginPath();
ctx.arc(206, 148, 16, Math.PI * 1.15, Math.PI * 1.85);
ctx.stroke();

/* ================= 小星光 ================= */
function star(cx, cy, r, rot, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 === 0 ? r : r * 0.44;
    ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}
star(516, 196, 9, -0.4, 'rgba(210,232,255,.95)');
star(548, 232, 5, 0.6, 'rgba(210,232,255,.8)');

/* 左边小泡泡 */
ctx.strokeStyle = 'rgba(160,190,240,.7)';
ctx.lineWidth = 5;
ctx.beginPath(); ctx.arc(72, 306, 12, 0, Math.PI * 2); ctx.stroke();
ctx.beginPath(); ctx.arc(48, 266, 7.5, 0, Math.PI * 2); ctx.stroke();
</script>
</body>
</html>
