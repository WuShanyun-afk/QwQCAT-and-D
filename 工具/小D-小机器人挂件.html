<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小D · 小机器人角色图（透明 PNG）</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="1220" height="1220"></canvas>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.scale(2, 2);            /* 610×610 坐标系，2 倍分辨率出图 */

/* ---------- 调色（跟 d-avatar.html 的头像同一套） ---------- */
const HEAD1 = '#b3a6ff';
const HEAD2 = '#6c5ce7';
const BODY1 = '#9a8bf8';
const BODY2 = '#4b3fc4';
const SCREEN1 = '#242242';
const SCREEN2 = '#0e0d22';
const CYAN = '#7ef7ff';
const GOLD1 = '#fff6b0';
const GOLD2 = '#ffb703';

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- 脑袋后面的柔光（半径收在画布里，不会留方框） ---------- */
const glow = ctx.createRadialGradient(305, 300, 40, 305, 300, 250);
glow.addColorStop(0, 'rgba(150,128,255,.22)');
glow.addColorStop(1, 'rgba(150,128,255,0)');
ctx.fillStyle = glow;
ctx.beginPath();
ctx.arc(305, 300, 250, 0, Math.PI * 2);
ctx.fill();

/* ---------- 天线 ---------- */
ctx.strokeStyle = '#8f7ff5';
ctx.lineWidth = 11;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(305, 168);
ctx.lineTo(305, 96);
ctx.stroke();

/* 金球（带光晕） */
ctx.save();
ctx.shadowColor = 'rgba(255,200,80,.9)';
ctx.shadowBlur = 34;
const ball = ctx.createRadialGradient(296, 70, 5, 305, 80, 28);
ball.addColorStop(0, GOLD1);
ball.addColorStop(1, GOLD2);
ctx.fillStyle = ball;
ctx.beginPath();
ctx.arc(305, 80, 23, 0, Math.PI * 2);
ctx.fill();
ctx.restore();
ctx.fillStyle = 'rgba(255,255,255,.85)';
ctx.beginPath();
ctx.arc(297, 71, 6.5, 0, Math.PI * 2);
ctx.fill();

/* ---------- 身体（先画，被脑袋压住一部分） ---------- */
const bodyG = ctx.createLinearGradient(0, 385, 0, 545);
bodyG.addColorStop(0, BODY1);
bodyG.addColorStop(1, BODY2);
ctx.fillStyle = bodyG;
rr(212, 392, 186, 132, 54);
ctx.fill();

/* 小脚 */
ctx.fillStyle = '#4338a8';
rr(238, 506, 62, 26, 13); ctx.fill();
rr(310, 506, 62, 26, 13); ctx.fill();

/* 小手 */
ctx.fillStyle = '#8f7ff5';
ctx.beginPath(); ctx.arc(196, 470, 21, 0, Math.PI * 2); ctx.fill();
ctx.beginPath(); ctx.arc(414, 470, 21, 0, Math.PI * 2); ctx.fill();

/* 胸口小胸章 */
ctx.fillStyle = 'rgba(20,18,42,.6)';
ctx.beginPath(); ctx.arc(305, 458, 27, 0, Math.PI * 2); ctx.fill();
ctx.strokeStyle = CYAN;
ctx.lineWidth = 8;
ctx.lineJoin = 'round';
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(292, 458);
ctx.lineTo(302, 469);
ctx.lineTo(320, 447);
ctx.stroke();

/* ---------- 脑袋 ---------- */
const headG = ctx.createLinearGradient(0, 150, 0, 425);
headG.addColorStop(0, HEAD1);
headG.addColorStop(1, HEAD2);
ctx.fillStyle = headG;
rr(128, 152, 354, 268, 88);
ctx.fill();

/* 头顶高光 */
ctx.save();
ctx.globalAlpha = .35;
ctx.fillStyle = '#e7e2ff';
ctx.beginPath();
ctx.ellipse(232, 196, 62, 27, -0.22, 0, Math.PI * 2);
ctx.fill();
ctx.restore();

/* ---------- 屏幕脸 ---------- */
const scrG = ctx.createRadialGradient(305, 250, 30, 305, 300, 190);
scrG.addColorStop(0, SCREEN1);
scrG.addColorStop(1, SCREEN2);
ctx.fillStyle = scrG;
rr(168, 192, 274, 192, 62);
ctx.fill();

/* 屏幕内一点反光（很淡，别糊成脏块） */

/* ---------- 眼睛（青色发光） ---------- */
for (const x of [250, 360]) {
  ctx.save();
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 20;
  ctx.fillStyle = CYAN;
  ctx.beginPath();
  ctx.arc(x, 272, 27, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  ctx.arc(x - 8, 262, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 8, 281, 4, 0, Math.PI * 2);
  ctx.fill();
}

/* ---------- 微笑 ---------- */
ctx.save();
ctx.shadowColor = CYAN;
ctx.shadowBlur = 14;
ctx.strokeStyle = CYAN;
ctx.lineWidth = 9;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(276, 326);
ctx.quadraticCurveTo(305, 352, 334, 326);
ctx.stroke();
ctx.restore();

/* ---------- 腮红（发光粉，叠在深色屏幕上） ---------- */
ctx.save();
ctx.globalCompositeOperation = 'lighter';
ctx.fillStyle = 'rgba(255,105,165,.72)';
ctx.beginPath(); ctx.ellipse(214, 336, 27, 15, 0, 0, Math.PI * 2); ctx.fill();
ctx.beginPath(); ctx.ellipse(396, 336, 27, 15, 0, 0, Math.PI * 2); ctx.fill();
ctx.restore();

/* ---------- 耳朵上的小螺丝 ---------- */
ctx.fillStyle = '#5b4fd0';
for (const s of [-1, 1]) {
  ctx.beginPath();
  ctx.arc(305 + s * 150, 292, 9, 0, Math.PI * 2);
  ctx.fill();
}

/* ---------- 旁边的小星星 ---------- */
function star(cx, cy, r, rot, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 === 0 ? r : r * 0.44;
    ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}
star(516, 214, 11, 0.3, 'rgba(126,247,255,.85)');
star(548, 178, 6, 0.9, 'rgba(126,247,255,.6)');
star(92, 250, 8, -0.2, 'rgba(185,167,255,.7)');
</script>
</body>
</html>
