<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>服装参考 · 夏日海边</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 900px; height: 1200px; padding: 34px 40px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #43354f;
    background: linear-gradient(160deg, #fdf7fb, #f2f0fd 55%, #eef7fd);
  }
  h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  .sub { margin: 8px 0 0; font-size: 14px; color: #8b83b5; }
  .stage {
    margin: 20px 0 0; height: 620px; border-radius: 26px; background: #ffffff;
    border: 1px solid #eae3f4; box-shadow: 0 12px 30px rgba(150,130,190,.12);
    display: flex; align-items: center; justify-content: center;
  }
  .palette { display: flex; gap: 16px; margin-top: 20px; }
  .chip { text-align: center; font-size: 12px; color: #7d7296; }
  .chip i { display: block; width: 64px; height: 44px; border-radius: 12px; margin-bottom: 6px;
            border: 1px solid rgba(0,0,0,.06); }
  .notes { margin-top: 18px; font-size: 14.5px; line-height: 1.95; color: #5d5178; }
  .tag { display: inline-block; font-size: 12px; background: #f3edff; color: #6b4fa8;
         border-radius: 999px; padding: 3px 12px; margin-right: 8px; }
</style>
</head>
<body>
  <h1>🌊 夏日海边版</h1>
  <p class="sub">给小D 画的服装参考 · 第 3 套（天气热的时候）</p>

  <div class="stage">
    <svg width="700" height="600" viewBox="0 0 700 600">
      <!-- 短袖衬衫 -->
      <path d="M262 130 h176 a22 22 0 0 1 22 22 v186 a22 22 0 0 1 -22 22 h-176 a22 22 0 0 1 -22 -22 v-186 a22 22 0 0 1 22 -22 z"
            fill="#cfe9fb" stroke="#8fc0e4" stroke-width="4"/>
      <!-- 短袖 -->
      <path d="M240 152 q-58 16 -64 84 q-2 26 22 30 q24 4 28 -22 l14 -92 z" fill="#cfe9fb" stroke="#8fc0e4" stroke-width="4"/>
      <path d="M460 152 q58 16 64 84 q2 26 -22 30 q-24 4 -28 -22 l-14 -92 z" fill="#cfe9fb" stroke="#8fc0e4" stroke-width="4"/>
      <!-- 小翻领 -->
      <path d="M302 130 l46 40 l-20 20 l-34 -34 z" fill="#eef8ff" stroke="#8fc0e4" stroke-width="4"/>
      <path d="M398 130 l-46 40 l20 20 l34 -34 z" fill="#eef8ff" stroke="#8fc0e4" stroke-width="4"/>
      <!-- 扣子 -->
      <circle cx="350" cy="210" r="5" fill="#ffffff" stroke="#8fc0e4" stroke-width="2"/>
      <circle cx="350" cy="256" r="5" fill="#ffffff" stroke="#8fc0e4" stroke-width="2"/>
      <circle cx="350" cy="302" r="5" fill="#ffffff" stroke="#8fc0e4" stroke-width="2"/>
      <!-- 胸前小鲸鱼刺绣 -->
      <path d="M300 236 q10 -14 20 0 q-5 10 -10 10 q-5 0 -10 -10 z" fill="#688ee6"/>

      <!-- 背带短裤 -->
      <path d="M268 380 h164 l16 116 h-86 l-12 -74 l-12 74 h-86 z" fill="#3b5c8a" stroke="#2f4a70" stroke-width="4"/>
      <rect x="286" y="330" width="16" height="56" rx="6" fill="#3b5c8a" stroke="#2f4a70" stroke-width="3"/>
      <rect x="398" y="330" width="16" height="56" rx="6" fill="#3b5c8a" stroke="#2f4a70" stroke-width="3"/>
      <rect x="284" y="350" width="20" height="10" rx="4" fill="#e9c46a"/>
      <rect x="396" y="350" width="20" height="10" rx="4" fill="#e9c46a"/>

      <!-- 小贝壳发夹 -->
      <path d="M470 200 q34 -42 62 -6 q-30 26 -62 6 z" fill="#ffe3ea" stroke="#e7a6b6" stroke-width="4"/>
      <path d="M482 196 l6 -22 M500 192 l2 -24 M518 198 l-4 -22" stroke="#e7a6b6" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="palette">
    <div class="chip"><i style="background:#cfe9fb"></i>浅蓝衬衫</div>
    <div class="chip"><i style="background:#3b5c8a"></i>牛仔蓝短裤</div>
    <div class="chip"><i style="background:#eef8ff"></i>领口白</div>
    <div class="chip"><i style="background:#e9c46a"></i>背带扣</div>
    <div class="chip"><i style="background:#ffe3ea"></i>贝壳粉</div>
  </div>

  <div class="notes">
    <span class="tag">款式</span>浅蓝色短袖衬衫（小翻领）+ 牛仔蓝背带短裤，裤脚不会太短<br>
    <span class="tag">小细节</span>胸前小鲸鱼刺绣、背带上有金色小扣子、鲸鱼发夹换成小贝壳发夹<br>
    <span class="tag">表情搭</span>「笑眼张嘴」的开心脸，可以在旁边画两个小海星和小水花
  </div>
</body>
</html>
