<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>服装参考 · 居家睡衣</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 900px; height: 1200px; padding: 34px 40px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #43354f;
    background: linear-gradient(160deg, #fdf7fb, #f2f0fd 55%, #eef7fd);
  }
  h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  .sub { margin: 8px 0 0; font-size: 14px; color: #8b83b5; }
  .stage {
    margin: 20px 0 0; height: 620px; border-radius: 26px; background: #ffffff;
    border: 1px solid #eae3f4; box-shadow: 0 12px 30px rgba(150,130,190,.12);
    display: flex; align-items: center; justify-content: center;
  }
  .palette { display: flex; gap: 16px; margin-top: 20px; }
  .chip { text-align: center; font-size: 12px; color: #7d7296; }
  .chip i { display: block; width: 64px; height: 44px; border-radius: 12px; margin-bottom: 6px;
            border: 1px solid rgba(0,0,0,.06); }
  .notes { margin-top: 18px; font-size: 14.5px; line-height: 1.95; color: #5d5178; }
  .notes b { color: #6b4fa8; }
  .tag { display: inline-block; font-size: 12px; background: #f3edff; color: #6b4fa8;
         border-radius: 999px; padding: 3px 12px; margin-right: 8px; }
</style>
</head>
<body>
  <h1>🌙 居家睡衣版</h1>
  <p class="sub">给小D 画的服装参考 · 第 1 套（配合晚上犯困的表情最好）</p>

  <div class="stage">
    <svg width="700" height="600" viewBox="0 0 700 600">
      <defs>
        <pattern id="plaid" width="46" height="46" patternUnits="userSpaceOnUse">
          <rect width="46" height="46" fill="#cfe4fb"/>
          <rect width="46" height="10" y="18" fill="#bcd8f8"/>
          <rect width="10" height="46" x="18" fill="#bcd8f8"/>
          <rect width="46" height="3" y="40" fill="#ffffff" opacity=".75"/>
          <rect width="3" height="46" x="40" fill="#ffffff" opacity=".75"/>
        </pattern>
        <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#e9eef8"/>
        </linearGradient>
      </defs>

      <!-- 上衣 -->
      <path d="M250 120 h200 a26 26 0 0 1 26 26 v210 a26 26 0 0 1 -26 26 h-200 a26 26 0 0 1 -26 -26 v-210 a26 26 0 0 1 26 -26 z"
            fill="url(#plaid)" stroke="#a9c7e8" stroke-width="4"/>
      <!-- 袖子 -->
      <path d="M224 150 q-64 26 -70 120 q-4 44 30 48 q30 3 34 -34 l10 -104 z"
            fill="url(#plaid)" stroke="#a9c7e8" stroke-width="4"/>
      <path d="M476 150 q64 26 70 120 q4 44 -30 48 q-30 3 -34 -34 l-10 -104 z"
            fill="url(#plaid)" stroke="#a9c7e8" stroke-width="4"/>
      <!-- 毛绒领口 -->
      <path d="M268 122 q82 66 164 0" fill="none" stroke="url(#fur)" stroke-width="26" stroke-linecap="round"/>
      <path d="M268 122 q82 66 164 0" fill="none" stroke="#f4f7fd" stroke-width="14" stroke-linecap="round"/>
      <!-- 门襟 + 扣子 -->
      <line x1="350" y1="140" x2="350" y2="380" stroke="#a9c7e8" stroke-width="3"/>
      <circle cx="350" cy="200" r="6" fill="#ffffff" stroke="#a9c7e8" stroke-width="2"/>
      <circle cx="350" cy="252" r="6" fill="#ffffff" stroke="#a9c7e8" stroke-width="2"/>
      <circle cx="350" cy="304" r="6" fill="#ffffff" stroke="#a9c7e8" stroke-width="2"/>
      <!-- 口袋 -->
      <rect x="262" y="300" width="60" height="52" rx="8" fill="none" stroke="#a9c7e8" stroke-width="3"/>

      <!-- 睡裤 -->
      <path d="M266 448 h168 l18 128 h-78 l-24 -86 l-24 86 h-78 z"
            fill="url(#plaid)" stroke="#a9c7e8" stroke-width="4"/>
      <!-- 裤脚毛边 -->
      <path d="M284 574 q34 18 66 0" fill="none" stroke="#f4f7fd" stroke-width="14" stroke-linecap="round"/>
      <path d="M420 574 q-34 18 -66 0" fill="none" stroke="#f4f7fd" stroke-width="14" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="palette">
    <div class="chip"><i style="background:#cfe4fb"></i>浅蓝格纹</div>
    <div class="chip"><i style="background:#bcd8f8"></i>格纹深线</div>
    <div class="chip"><i style="background:#ffffff"></i>毛绒白</div>
    <div class="chip"><i style="background:#e9eef8"></i>毛绒阴影</div>
    <div class="chip"><i style="background:#f8bac6"></i>小腮红</div>
  </div>

  <div class="notes">
    <span class="tag">款式</span>浅蓝格纹长袖睡衣 + 同款睡裤，圆领口加一圈白毛绒，裤脚也来一圈<br>
    <span class="tag">小细节</span>门襟三颗小扣子、口袋一个；可以抱着一个奶白色小抱枕<br>
    <span class="tag">表情搭</span>晚上九点犯困时的「笑眼闭嘴」最配，可以在脑袋边画两个 Zzz
  </div>
</body>
</html>
