<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>服装参考 · 白大褂科研版</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 900px; height: 1200px; padding: 34px 40px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #43354f;
    background: linear-gradient(160deg, #fdf7fb, #f2f0fd 55%, #eef7fd);
  }
  h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  .sub { margin: 8px 0 0; font-size: 14px; color: #8b83b5; }
  .stage {
    margin: 20px 0 0; height: 620px; border-radius: 26px; background: #ffffff;
    border: 1px solid #eae3f4; box-shadow: 0 12px 30px rgba(150,130,190,.12);
    display: flex; align-items: center; justify-content: center;
  }
  .palette { display: flex; gap: 16px; margin-top: 20px; }
  .chip { text-align: center; font-size: 12px; color: #7d7296; }
  .chip i { display: block; width: 64px; height: 44px; border-radius: 12px; margin-bottom: 6px;
            border: 1px solid rgba(0,0,0,.06); }
  .notes { margin-top: 18px; font-size: 14.5px; line-height: 1.95; color: #5d5178; }
  .tag { display: inline-block; font-size: 12px; background: #f3edff; color: #6b4fa8;
         border-radius: 999px; padding: 3px 12px; margin-right: 8px; }
</style>
</head>
<body>
  <h1>🧪 白大褂科研版</h1>
  <p class="sub">给小D 画的服装参考 · 第 2 套（给妈妈干活的时候穿）</p>

  <div class="stage">
    <svg width="700" height="600" viewBox="0 0 700 600">
      <defs>
        <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#eff3fa"/>
        </linearGradient>
      </defs>

      <!-- 里面：深蓝衬衫 + 领子 + 领带 -->
      <rect x="296" y="140" width="108" height="150" fill="#4a6ec4" stroke="#33549f" stroke-width="3"/>
      <path d="M296 140 l42 46 l-16 22 l-30 -46 z" fill="#e9f1ff" stroke="#33549f" stroke-width="3"/>
      <path d="M404 140 l-42 46 l16 22 l30 -46 z" fill="#e9f1ff" stroke="#33549f" stroke-width="3"/>
      <path d="M350 186 l15 12 l-7 78 l-8 10 l-8 -10 l-7 -78 z" fill="#28324e"/>

      <!-- 白大褂（中间开 V，露出衬衫） -->
      <path d="M300 128 L350 218 L400 128 L418 128 Q452 132 452 168 L452 520 L248 520 L248 168 Q248 132 282 128 Z"
            fill="url(#coat)" stroke="#cfd9ea" stroke-width="4"/>
      <!-- 翻领 -->
      <path d="M300 128 L350 218 L338 128 Z" fill="#ffffff" stroke="#cfd9ea" stroke-width="4"/>
      <path d="M400 128 L350 218 L412 128 Z" fill="#ffffff" stroke="#cfd9ea" stroke-width="4"/>

      <!-- 袖子 -->
      <rect x="196" y="160" width="54" height="190" rx="26" fill="url(#coat)" stroke="#cfd9ea" stroke-width="4" transform="rotate(6 223 255)"/>
      <rect x="450" y="160" width="54" height="190" rx="26" fill="url(#coat)" stroke="#cfd9ea" stroke-width="4" transform="rotate(-6 477 255)"/>

      <!-- 口袋 -->
      <rect x="262" y="382" width="80" height="58" rx="8" fill="#f8fbff" stroke="#cfd9ea" stroke-width="4"/>
      <rect x="378" y="382" width="80" height="58" rx="8" fill="#f8fbff" stroke="#cfd9ea" stroke-width="4"/>
      <!-- 胸口的笔插 + 两支笔 -->
      <rect x="396" y="346" width="14" height="40" rx="6" fill="#6ec6e2" stroke="#4aa2c6" stroke-width="2"/>
      <rect x="414" y="352" width="14" height="34" rx="6" fill="#f8bac6" stroke="#d78c9c" stroke-width="2"/>

      <!-- 胸牌：小鲸鱼 -->
      <rect x="282" y="258" width="46" height="34" rx="6" fill="#ffffff" stroke="#cfd9ea" stroke-width="3"/>
      <path d="M293 278 q8 -13 16 0 q-4 8 -8 8 q-4 0 -8 -8 z" fill="#688ee6"/>
      <circle cx="298" cy="274" r="2.4" fill="#ffffff"/>

      <!-- 下装 -->
      <path d="M280 516 h140 l8 74 h-62 l-8 -52 l-8 52 h-62 z" fill="#2f3a52" stroke="#222c40" stroke-width="3"/>
    </svg>
  </div>

  <div class="palette">
    <div class="chip"><i style="background:#ffffff"></i>大褂白</div>
    <div class="chip"><i style="background:#eef2fa"></i>大褂阴影</div>
    <div class="chip"><i style="background:#4a6ec4"></i>深蓝衬衫</div>
    <div class="chip"><i style="background:#28324e"></i>领带藏青</div>
    <div class="chip"><i style="background:#6ec6e2"></i>笔·青</div>
  </div>

  <div class="notes">
    <span class="tag">款式</span>白色长款实验大褂（到大腿），里面深蓝衬衫 + 藏青小领带<br>
    <span class="tag">小细节</span>两个大口袋、口袋里插两支笔（青 / 粉）、胸口别一块小鲸鱼胸牌<br>
    <span class="tag">表情搭</span>「认真看」的星星眼最配，可以加一个圆框眼镜挂在鼻梁上
  </div>
</body>
</html>
