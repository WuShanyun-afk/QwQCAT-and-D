<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪原正午 · 小狐狸 🦊❄️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #e8f1f8; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }

  .caption {
    position: fixed; left: 0; right: 0; bottom: 28px;
    text-align: center; pointer-events: none;
    animation: fadeUp 2.8s ease both;
  }
  .caption h1 {
    font-size: 19px; font-weight: 600; letter-spacing: 5px;
    color: #2b4257;
    text-shadow: 0 1px 14px rgba(255,255,255,.95), 0 1px 3px rgba(255,255,255,1);
  }
  .caption p {
    font-size: 12px; letter-spacing: 2.5px; color: #6d8598;
    margin-top: 7px;
    text-shadow: 0 1px 8px rgba(255,255,255,.95);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hint {
    position: fixed; top: 22px; left: 0; right: 0; text-align: center;
    font-size: 11.5px; letter-spacing: 1.5px; color: #5b7488;
    opacity: .9; pointer-events: none;
    text-shadow: 0 1px 8px rgba(255,255,255,.95);
  }
  body.clean .hint { display: none; }
  body.clean .caption { animation: none !important; }   /* 出图时署名直接满亮，避免截到淡入中途 */
   /* 出图用：?clean=1 去掉操作提示小字 */
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint">点一下雪地 · 会扬起一片雪沫 ❄️</div>
<div class="caption">
  <h1>雪 原 正 午</h1>
  <p>晴空 · 雪光 · 一只竖起耳朵的小狐狸</p>
</div>

<script>
if (location.search.includes('clean')) document.body.classList.add('clean');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

let seed = 771013;
function rnd() {
  seed = (seed * 9301 + 49297) % 233280;
  return seed / 233280;
}

/* ---------- 远山 ---------- */
function makeRidge(baseY, amp, freq, phase, step) {
  const pts = [];
  for (let x = 0; x <= 1.0001; x += step) {
    const y = baseY
      + Math.sin(x * freq + phase) * amp
      + Math.sin(x * freq * 2.6 + phase * 1.6) * amp * .40
      + Math.sin(x * freq * 5.7 + phase * .7) * amp * .15;
    pts.push({ x, y });
  }
  return pts;
}
const ridgeFar  = makeRidge(.395, .042, 2.6, 1.1, .02);
const ridgeMid  = makeRidge(.455, .055, 1.9, 3.0, .02);
const ridgeNear = makeRidge(.520, .036, 4.2, 5.2, .02);

/* ---------- 雪花 ---------- */
const snows = [];
for (let i = 0; i < 130; i++) {
  snows.push({
    x: rnd(), y: rnd(),
    r: .6 + rnd() * 2.0,
    sp: .012 + rnd() * .045,
    ph: rnd() * Math.PI * 2,
    drift: (rnd() - .5) * .03
  });
}

/* ---------- 雪沫（点击产生） ---------- */
const puffs = [];
function spawnPuff(x, y) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 40 + Math.random() * 130;
    puffs.push({
      x, y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v * .5 - 40,
      r: 1.5 + Math.random() * 3.5,
      life: 1
    });
  }
}

/* ---------- 雪地闪晶 ---------- */
const glints = [];
for (let i = 0; i < 110; i++) {
  glints.push({
    x: rnd(), y: .58 + rnd() * .42,
    ph: rnd() * Math.PI * 2,
    sp: .8 + rnd() * 3.0,
    r: .5 + rnd() * 1.3
  });
}

let time = 0, last = performance.now();

/* ---------- 小狐狸 ---------- */
function drawFox(cx, baseY, s, t) {
  const breathe = Math.sin(t * 1.3) * .006;
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(s, s);
  ctx.translate(0, breathe * 100);

  // 影子（雪地上偏蓝）
  ctx.fillStyle = 'rgba(120,150,180,.22)';
  ctx.beginPath();
  ctx.ellipse(2, 2, 40, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  const fur   = '#e0763a';   // 橘
  const furD  = '#c25a24';   // 深橘
  const cream = '#fdf3e6';   // 奶白
  const dark  = '#2e2018';

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  /* --- 尾巴（大而蓬松，向右后翘） --- */
  ctx.save();
  const tailSway = Math.sin(t * 1.6) * .10;
  ctx.translate(-30, -40);
  ctx.rotate(-.55 + tailSway);
  // 尾身
  ctx.fillStyle = fur;
  ctx.beginPath();
  ctx.ellipse(-22, 0, 26, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  // 尾尖白
  ctx.fillStyle = cream;
  ctx.beginPath();
  ctx.ellipse(-42, -1, 11, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  /* --- 四条腿（短而结实） --- */
  ctx.strokeStyle = furD;
  ctx.lineWidth = 7.5;
  ctx.beginPath(); ctx.moveTo(-17, -28); ctx.lineTo(-19, -5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-7, -28);  ctx.lineTo(-5, -5);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11, -29);  ctx.lineTo(14, -5);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, -28);  ctx.lineTo(25, -5);  ctx.stroke();
  // 白袜子
  ctx.strokeStyle = cream;
  ctx.lineWidth = 7.5;
  ctx.beginPath(); ctx.moveTo(-19, -11); ctx.lineTo(-19, -5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5, -11);  ctx.lineTo(-5, -5);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14, -11);  ctx.lineTo(14, -5);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(25, -11);  ctx.lineTo(25, -5);  ctx.stroke();

  /* --- 身体 --- */
  ctx.fillStyle = fur;
  ctx.beginPath();
  ctx.ellipse(0, -40, 34, 19, -.04, 0, Math.PI * 2);
  ctx.fill();
  // 胸口白
  ctx.fillStyle = cream;
  ctx.beginPath();
  ctx.ellipse(5, -35, 24, 12, -.04, 0, Math.PI * 2);
  ctx.fill();

  /* --- 脖子 + 头（抬头，看向右前方） --- */
  ctx.strokeStyle = fur;
  ctx.lineWidth = 16;
  ctx.beginPath();
  ctx.moveTo(22, -48);
  ctx.quadraticCurveTo(32, -56, 36, -64);
  ctx.stroke();

  const headX = 38, headY = -69;
  ctx.save();
  ctx.translate(headX, headY);
  ctx.rotate(-.16);   // 微微抬头

  // 头骨
  ctx.fillStyle = fur;
  ctx.beginPath();
  ctx.ellipse(0, 0, 13, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // 口鼻（尖）
  ctx.fillStyle = cream;
  ctx.beginPath();
  ctx.moveTo(6, -6);
  ctx.quadraticCurveTo(24, -2, 23, 4);
  ctx.quadraticCurveTo(22, 9, 6, 8);
  ctx.closePath();
  ctx.fill();
  // 鼻头
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.ellipse(22, 3, 2.6, 2.0, 0, 0, Math.PI * 2);
  ctx.fill();

  // 耳朵（三角，竖立）
  function ear(ox, oy, rot, h) {
    ctx.save();
    ctx.translate(ox, oy);
    ctx.rotate(rot);
    ctx.fillStyle = furD;
    ctx.beginPath();
    ctx.moveTo(-5, 4);
    ctx.lineTo(0, -h);
    ctx.lineTo(5, 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f0a878';
    ctx.beginPath();
    ctx.moveTo(-2.6, 2.4);
    ctx.lineTo(0, -h * .72);
    ctx.lineTo(2.6, 2.4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ear(-7, -8, -.30, 17);
  ear(4, -9, .16, 16);

  // 眼睛（会眨）
  const blink = (Math.sin(t * 1.1) > .982) ? .10 : 1;
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.ellipse(6, -2, 2.3, 2.3 * blink, 0, 0, Math.PI * 2);
  ctx.fill();
  if (blink > .5) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath();
    ctx.arc(6.8, -2.9, .85, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.restore();
}

function loop(now) {
  const dt = Math.min((now - last) / 1000, .05);
  last = now; time += dt;

  const horizon = H * .545;

  /* ================= 正午晴空 ================= */
  const sky = ctx.createLinearGradient(0, 0, 0, horizon + 20);
  sky.addColorStop(0,   '#5fa8dd');
  sky.addColorStop(.38, '#8fc4e8');
  sky.addColorStop(.70, '#c2dff0');
  sky.addColorStop(1,   '#e6f2f8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, horizon + 20);

  /* --- 太阳（正午，高悬，小而亮） --- */
  const sunX = W * .70, sunY = H * .16;
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, H * .40);
  sunGlow.addColorStop(0,  'rgba(255,252,235,.85)');
  sunGlow.addColorStop(.12,'rgba(255,248,215,.42)');
  sunGlow.addColorStop(.40,'rgba(255,245,205,.14)');
  sunGlow.addColorStop(1,  'rgba(255,245,205,0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, W, horizon + 20);

  ctx.fillStyle = 'rgba(255,255,250,.95)';
  ctx.beginPath();
  ctx.arc(sunX, sunY, H * .026, 0, Math.PI * 2);
  ctx.fill();

  /* --- 云（蓬松的积云） --- */
  const clouds = [
    { x: .16, y: .14, w: .17, h: .040, a: .82 },
    { x: .46, y: .24, w: .12, h: .028, a: .62 },
    { x: .84, y: .09, w: .14, h: .033, a: .55 }
  ];
  clouds.forEach((c, i) => {
    const cx2 = ((c.x + time * .006 * (1 + i * .3)) % 1.2 - .1) * W;
    const cy2 = c.y * H;
    const cw = c.w * W, ch = c.h * H;
    // 一朵云 = 几个圆叠起来
    const lobes = [
      [-.34, .18, .34, .62],
      [-.14, -.05, .42, .95],
      [ .10, -.14, .40, 1.00],
      [ .32, .10, .32, .72],
      [ .00, .22, .50, .70]
    ];
    lobes.forEach(l => {
      ctx.fillStyle = `rgba(255,255,255,${c.a})`;
      ctx.beginPath();
      ctx.ellipse(cx2 + l[0] * cw * .5, cy2 + l[1] * ch, cw * l[2] * .5, ch * l[3], 0, 0, Math.PI * 2);
      ctx.fill();
    });
    // 云底淡淡的阴影
    ctx.fillStyle = `rgba(190,212,232,${c.a * .30})`;
    ctx.beginPath();
    ctx.ellipse(cx2 + cw * .02, cy2 + ch * .42, cw * .40, ch * .30, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  /* ================= 雪山（三层） ================= */
  function drawRidge(pts, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    pts.forEach(p => ctx.lineTo(p.x * W, p.y * H));
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }
  drawRidge(ridgeFar,  'rgba(178,203,224,.62)');
  drawRidge(ridgeMid,  'rgba(146,178,206,.78)');
  drawRidge(ridgeNear, 'rgba(112,148,182,.92)');

  /* --- 山顶积雪（在近山脊上铺白） --- */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, H);
  ridgeNear.forEach(p => ctx.lineTo(p.x * W, p.y * H));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.beginPath();
  ctx.moveTo(-20, H * .545);
  for (let x = 0; x <= W + 20; x += 14) {
    const p = x / W;
    const y = H * .528 + Math.sin(p * 4.2 + 5.2) * H * .022;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 20, H * .545);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* ================= 雪原 ================= */
  const snowTop = H * .615;   // 雪原从山脚下方开始，给山留出空间
  const snowG = ctx.createLinearGradient(0, snowTop, 0, H);
  snowG.addColorStop(0,   '#cfdfee');
  snowG.addColorStop(.22, '#e2eef8');
  snowG.addColorStop(.55, '#f2f9ff');
  snowG.addColorStop(1,   '#ffffff');
  ctx.fillStyle = snowG;
  ctx.fillRect(0, snowTop, W, H - snowTop);

  /* --- 雪地起伏（几道柔和的雪坡阴影） --- */
  for (let i = 0; i < 5; i++) {
    const p = i / 5;
    const y = snowTop + Math.pow(p, 1.4) * (H - snowTop) * .92;
    const a = .05 + p * .07;
    ctx.fillStyle = `rgba(150,180,210,${a})`;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= W + 10; x += 16) {
      const q = x / W;
      const yy = y + Math.sin(q * (2.2 + i * .8) + i * 2.1) * H * (.010 + i * .004);
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(W, y + H * .05);
    ctx.lineTo(0, y + H * .05);
    ctx.closePath();
    ctx.fill();
  }

  /* --- 雪地闪晶 --- */
  glints.forEach(g => {
    g.ph += dt * g.sp;
    const a = .20 + Math.sin(g.ph) * .42;
    if (a <= 0) return;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(g.x * W, g.y * H, g.r, 0, Math.PI * 2);
    ctx.fill();
  });

  /* ================= 小狐狸 ================= */
  const foxScale = Math.min(W, H) / 640;
  drawFox(W * .40, H * .855, foxScale * 1.45, time);

  /* ================= 雪沫粒子 ================= */
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 90 * dt;
    p.life -= dt * .85;
    if (p.life <= 0) { puffs.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(255,255,255,${.85 * p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ================= 飘雪 ================= */
  snows.forEach(s => {
    s.y += s.sp * dt;
    s.x += (s.drift + Math.sin(time * .6 + s.ph) * .012) * dt;
    if (s.y > 1.02) { s.y = -.02; s.x = Math.random(); }
    if (s.x > 1.02) s.x = -.02;
    if (s.x < -.02) s.x = 1.02;
    const a = .35 + Math.sin(time * 1.4 + s.ph) * .25;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  /* ================= 冷调暗角 ================= */
  const vig = ctx.createRadialGradient(W * .5, H * .46, Math.min(W, H) * .40, W * .5, H * .5, Math.max(W, H) * .82);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(60,100,140,.26)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('pointerdown', e => spawnPuff(e.clientX, e.clientY));
</script>
</body>
</html>
