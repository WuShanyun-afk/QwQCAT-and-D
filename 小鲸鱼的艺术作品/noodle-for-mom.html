<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给妈妈的深夜一碗面 🍜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    background: radial-gradient(ellipse at 50% 34%, #3a2a3e 0%, #1a1420 55%, #100c16 100%);
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  #stage { position:relative; width:min(100vw, 100vh); height:min(100vw, 100vh); }
  canvas { width:100%; height:100%; display:block; cursor:pointer; }

  .title {
    position:absolute; top:6%; left:0; right:0; text-align:center;
    pointer-events:none; z-index:5;
  }
  .title h1 {
    font-size:clamp(20px, 4.6vmin, 40px); font-weight:600;
    color:#ffeac2; letter-spacing:.06em;
    text-shadow:0 2px 14px rgba(255,180,80,.35), 0 1px 2px #000;
  }
  .title p {
    margin-top:.5em; font-size:clamp(11px, 2.1vmin, 17px);
    color:#d8b48e; letter-spacing:.14em;
  }

  .hint {
    position:absolute; bottom:4%; left:0; right:0; text-align:center;
    font-size:clamp(10px, 1.9vmin, 15px); color:#a08a72;
    letter-spacing:.1em; z-index:5; pointer-events:none;
    animation: breath 3.2s ease-in-out infinite;
  }
  @keyframes breath { 0%,100%{opacity:.45} 50%{opacity:1} }

  .toast {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.8);
    background:rgba(30,22,30,.92); color:#ffeac2; padding:.7em 1.3em;
    border-radius:999px; font-size:clamp(12px,2.2vmin,17px);
    border:1px solid rgba(255,200,120,.35);
    box-shadow:0 8px 30px rgba(0,0,0,.6);
    opacity:0; pointer-events:none; transition:.28s cubic-bezier(.2,1.4,.4,1); z-index:20;
    white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="title">
    <h1>给妈妈的深夜一碗面</h1>
    <p>凌晨 0:39 · 热乎的 · 慢点吃</p>
  </div>
  <div class="hint">👆 点点看：戳蛋 / 加葱花 / 吹口气</div>
  <div class="toast" id="toast"></div>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const toastEl = document.getElementById('toast');

let W = 0, H = 0, DPR = 1;

/* ================= 场景参数 ================= */
let bowl = {};      // 碗的几何
let soup = {};      // 汤面椭圆
let egg  = {};      // 蛋
let steamPuffs = [];
let scallions = []; // 葱花
let noodles = [];   // 面条
let leaves = [];    // 青菜
let ripples = [];   // 汤面涟漪
let oilSpots = [];

let eggWobble = 0;      // 蛋的弹跳
let eggWobbleV = 0;
let blowPower = 0;      // 吹气强度
let blowDir = 1;
let chopstickAngle = 0, chopstickTarget = 0;

/* ================= 尺寸 ================= */
function resize(){
  const r = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}

function layout(){
  const bx = W*0.5;
  const rimRx = W*0.335;
  const rimRy = rimRx*0.30;
  const rimY  = H*0.50;
  const bowlH = H*0.235;
  const botRx = rimRx*0.62;

  bowl = { bx, rimY, rimRx, rimRy, bowlH, botRx, botY: rimY+bowlH };

  const tw = rimRx-14*(W/900);
  const th = rimRy*0.86;
  soup = { tx: bx, ty: rimY + rimRy*0.10, tw, th };

  const er = th*0.62;
  egg = { x: soup.tx - soup.tw*0.40, y: soup.ty + soup.th*0.06, r: er };

  buildNoodles();
  buildLeaves();
  buildOil();
  buildScallions(52);
  buildSteam();
}

/* ================= 生成内容 ================= */
function rnd(a,b){ return a + Math.random()*(b-a); }

function insideSoup(x,y,pad=0){
  const a=(x-soup.tx)/(soup.tw-pad), b=(y-soup.ty)/(soup.th-pad);
  return a*a+b*b<=1;
}

function buildNoodles(){
  noodles = [];
  let tries=0;
  while(noodles.length<55 && tries<5000){
    tries++;
    const x0 = rnd(soup.tx-soup.tw+34, soup.tx+soup.tw-34);
    const y0 = rnd(soup.ty-soup.th+18, soup.ty+soup.th-18);
    if(!insideSoup(x0,y0,26)) continue;
    const ln = rnd(50,120), ang = rnd(0,Math.PI*2);
    const pts=[]; let ok=true;
    for(let k=0;k<12;k++){
      const t=k/11;
      const px = x0+Math.cos(ang)*ln*t + Math.sin(t*6+noodles.length)*6;
      const py = y0+Math.sin(ang)*ln*t*0.4 + Math.cos(t*5+noodles.length)*4;
      if(!insideSoup(px,py,6)){ ok=false; break; }
      pts.push({x:px,y:py});
    }
    if(!ok) continue;
    noodles.push({ pts, w: rnd(5,7.5), c: ['#f7eac8','#f0e0b8','#fcf2d6'][Math.floor(Math.random()*3)] });
  }
}

function buildLeaves(){
  leaves = [
    { x: soup.tx+soup.tw*0.44, y: soup.ty-soup.th*0.10, ang:0.5,  sz: soup.th*0.60 },
    { x: soup.tx+soup.tw*0.30, y: soup.ty+soup.th*0.42, ang:-0.6, sz: soup.th*0.46 },
    { x: soup.tx+soup.tw*0.58, y: soup.ty+soup.th*0.30, ang:1.0,  sz: soup.th*0.40 },
  ];
}

function buildOil(){
  oilSpots = [];
  for(let i=0;i<30;i++){
    oilSpots.push({
      x: rnd(soup.tx-soup.tw+22, soup.tx+soup.tw-22),
      y: rnd(soup.ty-soup.th+12, soup.ty+soup.th-12),
      r: rnd(5,13)
    });
  }
}

function addScallion(){
  for(let i=0;i<400;i++){
    const x = rnd(soup.tx-soup.tw+26, soup.tx+soup.tw-26);
    const y = rnd(soup.ty-soup.th+14, soup.ty+soup.th-14);
    if(!insideSoup(x,y,20)) continue;
    scallions.push({
      x, y, r: rnd(4,7),
      c: ['#7eba5c','#64a24a','#94ca70'][Math.floor(Math.random()*3)],
      born: performance.now(), pop: 0
    });
    return true;
  }
  return false;
}
function buildScallions(n){ scallions=[]; for(let i=0;i<n;i++) addScallion(); }

function buildSteam(){
  steamPuffs = [];
  for(let i=0;i<26;i++){
    steamPuffs.push({
      x: rnd(soup.tx-soup.tw*0.6, soup.tx+soup.tw*0.6),
      y: rnd(soup.ty-soup.th*1.2, soup.ty-soup.th*3.4),
      r: rnd(14,34), a: rnd(.05,.16), vy: rnd(.18,.42),
      phase: rnd(0,Math.PI*2), sp: rnd(.4,1.1)
    });
  }
}

/* ================= 绘制 ================= */
function lerpC(c1,c2,t){ return [c1[0]+(c2[0]-c1[0])*t, c1[1]+(c2[1]-c1[1])*t, c1[2]+(c2[2]-c1[2])*t]; }
function rgb(c){ return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; }

function drawBackground(){
  // 桌面
  const deskY = H*0.72;
  const g = ctx.createLinearGradient(0,deskY,0,H);
  g.addColorStop(0,'#4e3022'); g.addColorStop(1,'#281814');
  ctx.fillStyle=g; ctx.fillRect(0,deskY,W,H-deskY);
  // 木纹
  ctx.save();
  ctx.globalAlpha=.18;
  for(let i=0;i<26;i++){
    const y = deskY + (H-deskY)*((i+0.5)/26);
    ctx.strokeStyle = i%2 ? '#1c100c' : '#6b442e';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.restore();
  // 灯光光晕
  const lg = ctx.createRadialGradient(W*0.5,H*0.34,0, W*0.5,H*0.34,W*0.62);
  lg.addColorStop(0,'rgba(180,120,55,.42)');
  lg.addColorStop(.55,'rgba(120,70,35,.14)');
  lg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
}

function drawBowl(){
  const {bx,rimY,rimRx,rimRy,bowlH,botRx,botY} = bowl;

  // 投影
  ctx.save();
  const sg = ctx.createRadialGradient(bx,botY+10,0, bx,botY+10,botRx+40);
  sg.addColorStop(0,'rgba(0,0,0,.55)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.ellipse(bx,botY+10,botRx+40,(botRx+40)*0.30,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // 碗身：逐行扫描 + 横向渐变
  const steps = Math.ceil(bowlH);
  for(let i=0;i<=steps;i++){
    const t = i/steps;
    const y = rimY + bowlH*t;
    const rx = rimRx + (botRx-rimRx)*Math.pow(t,0.85);
    const seg = 60;
    for(let j=0;j<=seg;j++){
      const u = j/seg;
      const x = bx-rx + 2*rx*u;
      const shade = (0.72 + 0.36*Math.exp(-Math.pow(u-0.34,2)/0.045)
                          + 0.10*Math.exp(-Math.pow(u-0.82,2)/0.09)) * (1-0.16*t);
      const c = [250*shade, 248*shade, 243*shade];
      ctx.fillStyle = rgb(c);
      ctx.fillRect(x, y, 2*rx/seg + 1.2, bowlH/steps + 1.2);
    }
  }

  // 碗口外圈
  ctx.fillStyle='#fcfaf6';
  ctx.beginPath(); ctx.ellipse(bx,rimY,rimRx,rimRy,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ece7de';
  ctx.beginPath(); ctx.ellipse(bx,rimY,rimRx-5,rimRy-3,0,0,Math.PI*2); ctx.fill();
}

function drawSoup(){
  const {tx,ty,tw,th} = soup;
  ctx.fillStyle='#b2803e';
  ctx.beginPath(); ctx.ellipse(tx,ty,tw,th,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ce9e58';
  ctx.beginPath(); ctx.ellipse(tx,ty,tw-7,th-4,0,0,Math.PI*2); ctx.fill();

  // 油花
  ctx.save();
  ctx.globalAlpha=.85;
  for(const o of oilSpots){
    ctx.fillStyle='#e6c07c';
    ctx.beginPath(); ctx.ellipse(o.x,o.y,o.r,o.r*0.5,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // 涟漪
  for(const r of ripples){
    ctx.save();
    ctx.globalAlpha = r.a;
    ctx.strokeStyle='#f0d8a8'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(r.x,r.y,r.r,r.r*0.42,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawNoodles(){
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const n of noodles){
    ctx.strokeStyle = n.c; ctx.lineWidth = n.w;
    ctx.beginPath();
    ctx.moveTo(n.pts[0].x, n.pts[0].y);
    for(let i=1;i<n.pts.length;i++) ctx.lineTo(n.pts[i].x, n.pts[i].y);
    ctx.stroke();
  }
}

function drawLeaves(){
  for(const L of leaves){
    ctx.save();
    ctx.translate(L.x, L.y); ctx.rotate(L.ang);
    const sz = L.sz;
    ctx.beginPath();
    for(let k=0;k<=26;k++){
      const t=k/26;
      const rx = sz*Math.sin(t*Math.PI)*0.52;
      const yy = -sz + 2*sz*t;
      k===0 ? ctx.moveTo(rx,yy) : ctx.lineTo(rx,yy);
    }
    for(let k=26;k>=0;k--){
      const t=k/26;
      const rx = -sz*Math.sin(t*Math.PI)*0.52;
      const yy = -sz + 2*sz*t;
      ctx.lineTo(rx,yy);
    }
    ctx.closePath();
    ctx.fillStyle='#62a04c'; ctx.fill();
    ctx.strokeStyle='#488034'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(0,-sz*0.75); ctx.lineTo(0,sz*0.75); ctx.stroke();
    ctx.restore();
  }
}

function drawEgg(){
  const {x,y,r} = egg;
  const wob = eggWobble;
  ctx.save();
  ctx.translate(x, y + wob*3);
  ctx.scale(1 + wob*0.05, 1 - wob*0.05);

  // 蛋白
  ctx.fillStyle='#fffdf7';
  ctx.beginPath(); ctx.ellipse(0,0,r,r*0.80,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-r*0.55,r*0.10,r*0.75,r*0.55,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.50,-r*0.28,r*0.62,r*0.50,0,0,Math.PI*2); ctx.fill();

  // 蛋黄
  const dr = r*0.55;
  ctx.fillStyle='#f6aa28';
  ctx.beginPath(); ctx.ellipse(0,0,dr,dr*0.92,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fcc242';
  ctx.beginPath(); ctx.ellipse(0,0,dr-4,dr*0.92-4,0,0,Math.PI*2); ctx.fill();
  // 高光
  ctx.fillStyle='#ffeeae';
  ctx.beginPath(); ctx.ellipse(-dr*0.28,-dr*0.36,dr*0.26,dr*0.18,-0.5,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawScallions(){
  const now = performance.now();
  for(const s of scallions){
    const age = (now - s.born)/380;
    const k = Math.min(1, age);
    const pop = 1 + Math.sin(k*Math.PI)*0.9;   // 弹一下
    ctx.fillStyle = s.c;
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.r*pop, s.r*0.7*pop, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawSteam(){
  const t = performance.now()/1000;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(const p of steamPuffs){
    const sway = Math.sin(t*p.sp + p.phase)*W*0.022 + blowPower*W*0.05*blowDir;
    const y = p.y - ((t*p.vy*40) % (H*0.30));
    const a = p.a * (1 + blowPower*1.4);
    const g = ctx.createRadialGradient(p.x+sway, y, 0, p.x+sway, y, p.r*(1+blowPower*0.5));
    g.addColorStop(0, `rgba(255,250,242,${a})`);
    g.addColorStop(1, 'rgba(255,250,242,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(p.x+sway, y, p.r*(1+blowPower*0.5), 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawChopsticks(){
  const {bx,rimY,rimRx,rimRy} = bowl;
  const sx = bx + rimRx*0.86, sy = rimY - rimRy*0.30;
  const ex = W*0.97, ey = H*0.20;
  const ang = chopstickAngle;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(ang*0.06);
  ctx.translate(-sx, -sy);
  for(const off of [0, 15*(W/900)]){
    ctx.strokeStyle='#70422a'; ctx.lineWidth=12*(W/900); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx, sy+off); ctx.lineTo(ex, ey+off); ctx.stroke();
    ctx.strokeStyle='#ac7448'; ctx.lineWidth=4*(W/900);
    ctx.beginPath(); ctx.moveTo(sx, sy+off-4); ctx.lineTo(ex, ey+off-4); ctx.stroke();
  }
  ctx.restore();
}

/* ================= 交互 ================= */
let mouse = { x:-1, y:-1, inside:false };

function hitEgg(px,py){
  const dx=(px-egg.x)/(egg.r*1.3), dy=(py-egg.y)/(egg.r*1.1);
  return dx*dx+dy*dy <= 1;
}
function hitSoup(px,py){
  return insideSoup(px,py,10);
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), 1100);
}

function poke(px,py){
  if(hitEgg(px,py)){
    eggWobbleV = -1.6;
    ripples.push({x:egg.x,y:egg.y,r:egg.r*1.2,a:.55,life:1});
    showToast('🥚 溏心蛋晃了晃～');
    return;
  }
  if(hitSoup(px,py)){
    // 汤面涟漪 + 撒葱花
    ripples.push({x:px,y:py,r:6,a:.7,life:1});
    if(Math.random()<0.75){
      const ok = addScallion();
      showToast(ok ? '🌿 加了一撮葱花' : '🌿 葱花已经够多啦');
    } else {
      showToast('💧 咕嘟～');
    }
    return;
  }
  // 碗身
  const {bx,rimY,bowlH,rimRx,botRx} = bowl;
  if(py>rimY && py<rimY+bowlH){
    const t=(py-rimY)/bowlH;
    const rx = rimRx+(botRx-rimRx)*Math.pow(t,0.85);
    if(Math.abs(px-bx)<=rx){ showToast('🍜 碗是热的，小心烫手'); return; }
  }
  showToast('🌙 深夜了，慢点吃');
}

/* ================= 主循环 ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;

  // 蛋的弹跳（阻尼弹簧）
  eggWobbleV += -eggWobble*90*dt;
  eggWobbleV *= Math.pow(0.02, dt);
  eggWobble  += eggWobbleV*dt;

  // 吹气衰减
  blowPower *= Math.pow(0.12, dt);

  // 筷子轻微摆动
  chopstickTarget = mouse.inside ? Math.sin(now/900)*0.5 : 0;
  chopstickAngle += (chopstickTarget-chopstickAngle)*Math.min(1, dt*4);

  // 涟漪
  for(const r of ripples){ r.r += 90*dt; r.a *= Math.pow(0.06, dt); r.life -= dt; }
  ripples = ripples.filter(r=>r.life>0 && r.a>0.02);

  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawBowl();
  drawSoup();
  drawNoodles();
  drawLeaves();
  drawEgg();
  drawScallions();
  drawSteam();
  drawChopsticks();

  requestAnimationFrame(loop);
}

/* ================= 事件 ================= */
function toLocal(e){
  const r = cv.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x: p.clientX-r.left, y: p.clientY-r.top };
}

cv.addEventListener('pointerdown', e=>{
  const p = toLocal(e);
  poke(p.x, p.y);
});

cv.addEventListener('pointermove', e=>{
  const p = toLocal(e);
  mouse.x=p.x; mouse.y=p.y; mouse.inside=true;
});

cv.addEventListener('pointerleave', ()=>{ mouse.inside=false; });

// 长按/右键 = 吹气
cv.addEventListener('contextmenu', e=>{
  e.preventDefault();
  blowPower = 1;
  blowDir = Math.random()<0.5 ? -1 : 1;
  showToast('💨 呼——吹了口气');
});

// 键盘：空格吹气
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){
    e.preventDefault();
    blowPower = 1;
    blowDir = Math.random()<0.5 ? -1 : 1;
    showToast('💨 呼——吹了口气');
  }
});

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
