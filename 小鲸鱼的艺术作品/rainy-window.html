<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨后窗台 · 风景画 🌧️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #0d1418; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }

  .caption {
    position: fixed; left: 0; right: 0; bottom: 28px;
    text-align: center; pointer-events: none;
    animation: fadeUp 2.8s ease both;
  }
  .caption h1 {
    font-size: 19px; font-weight: 600; letter-spacing: 5px;
    color: #dff0f2;
    text-shadow: 0 0 18px rgba(140,220,220,.5), 0 2px 8px rgba(0,0,0,.6);
  }
  .caption p {
    font-size: 12px; letter-spacing: 2.5px; color: #7fa5a8;
    margin-top: 7px;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hint {
    position: fixed; top: 22px; left: 0; right: 0; text-align: center;
    font-size: 11.5px; letter-spacing: 1.5px; color: #6d9498;
    opacity: .85; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint">点一下玻璃 · 会滑下一道水痕 💧</div>
<div class="caption">
  <h1>雨 后 窗 台</h1>
  <p>雾青色的远山 · 慢慢滑落的水珠</p>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

let seed = 777001;
function rnd() {
  seed = (seed * 9301 + 49297) % 233280;
  return seed / 233280;
}

/* ---------- 玻璃上的小水珠 ---------- */
const drops = [];
for (let i = 0; i < 55; i++) {
  drops.push({
    x: rnd(), y: rnd(),
    r: 1.2 + rnd() * 3.2,
    vy: 0,
    stuck: true,
    delay: rnd() * 6
  });
}

/* ---------- 滑落的水痕 ---------- */
const trails = [];

/* ---------- 山脊 ---------- */
function ridge(baseY, amp, step, color, alpha, tOff) {
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W + step; x += step) {
    const p = x / W;
    const y = baseY
      + Math.sin(p * 5.4 + tOff) * amp
      + Math.sin(p * 12.1 + tOff * 1.9) * amp * .5
      + Math.sin(p * 24.6 + tOff * 3.1) * amp * .2;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

let time = 0, last = performance.now();

function loop(now) {
  const dt = Math.min((now - last) / 1000, .05);
  last = now; time += dt;

  const horizon = H * .58;

  /* --- 天空：雾青灰渐变 --- */
  const sky = ctx.createLinearGradient(0, 0, 0, horizon + 40);
  sky.addColorStop(0,   '#8fa8ae');
  sky.addColorStop(.35, '#a8bfc2');
  sky.addColorStop(.68, '#c3d3d2');
  sky.addColorStop(1,   '#dbe6e2');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, horizon + 40);

  /* --- 云层（低饱和） --- */
  for (let i = 0; i < 7; i++) {
    const cx = ((i * 0.17 + time * 0.004) % 1.3 - .15) * W;
    const cy = (.10 + (i * 0.061) % .34) * H;
    const cw = (.18 + (i % 3) * .07) * W;
    const ch = (.018 + (i % 2) * .012) * H;
    const g = ctx.createLinearGradient(cx, cy - ch, cx, cy + ch);
    g.addColorStop(0, 'rgba(255,255,255,.42)');
    g.addColorStop(1, 'rgba(210,225,225,.12)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy, cw, ch, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /* --- 远山：层层雾青 --- */
  ridge(horizon - H * .060, H * .028, 14, '#8fa8ab', .45, 0.6);
  ridge(horizon - H * .022, H * .040, 12, '#6f8f94', .62, 1.9);
  ridge(horizon + H * .012, H * .048, 10, '#4f6f76', .80, 3.4);

  /* --- 山谷雾 --- */
  const mist = ctx.createLinearGradient(0, horizon - H * .01, 0, horizon + H * .11);
  mist.addColorStop(0, 'rgba(230,240,238,.55)');
  mist.addColorStop(.45, 'rgba(215,230,228,.28)');
  mist.addColorStop(1, 'rgba(180,200,200,0)');
  ctx.fillStyle = mist;
  ctx.fillRect(0, horizon - H * .01, W, H * .13);

  /* --- 近景山脊 --- */
  ridge(horizon + H * .070, H * .052, 9, '#33484f', 1, 5.0);

  /* --- 地面 --- */
  const ground = ctx.createLinearGradient(0, H * .80, 0, H);
  ground.addColorStop(0, 'rgba(28,42,48,0)');
  ground.addColorStop(1, 'rgba(14,24,28,1)');
  ctx.fillStyle = ground;
  ctx.fillRect(0, H * .80, W, H * .20);

  /* --- 玻璃水珠 --- */
  drops.forEach(d => {
    d.delay -= dt;
    if (d.stuck && d.delay <= 0 && Math.random() < dt * .35) {
      d.stuck = false;
      d.vy = .02 + Math.random() * .05;
      trails.push({ x: d.x, y: d.y, len: 0, r: d.r });
    }
    if (!d.stuck) {
      d.vy += dt * .35;
      d.y += d.vy * dt * 6;
      if (d.y > 1.05) { d.y = -.05; d.x = Math.random(); d.vy = 0; d.stuck = true; d.delay = 2 + Math.random() * 6; }
    }
    const px = d.x * W, py = d.y * H;
    // 水珠本体
    const g = ctx.createRadialGradient(px - d.r * .3, py - d.r * .3, d.r * .1, px, py, d.r);
    g.addColorStop(0, 'rgba(255,255,255,.75)');
    g.addColorStop(.6, 'rgba(200,225,230,.30)');
    g.addColorStop(1, 'rgba(150,185,195,.12)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, d.r, 0, Math.PI * 2);
    ctx.fill();
    // 高光点
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath();
    ctx.arc(px - d.r * .35, py - d.r * .35, d.r * .22, 0, Math.PI * 2);
    ctx.fill();
  });

  /* --- 水痕 --- */
  for (let i = trails.length - 1; i >= 0; i--) {
    const t = trails[i];
    t.len += dt * .35;
    if (t.len > .5) { trails.splice(i, 1); continue; }
    const tx = t.x * W, ty = t.y * H;
    const g = ctx.createLinearGradient(tx, ty - t.len * H, tx, ty);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(255,255,255,.22)');
    ctx.strokeStyle = g;
    ctx.lineWidth = t.r * 1.1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx, ty - t.len * H);
    ctx.lineTo(tx, ty);
    ctx.stroke();
  }

  /* --- 窗框剪影 --- */
  ctx.fillStyle = 'rgba(10,18,22,.92)';
  ctx.fillRect(0, 0, W, H * .022);          // 上框
  ctx.fillRect(0, H * .978, W, H * .022);   // 下框
  ctx.fillRect(0, 0, W * .018, H);          // 左框
  ctx.fillRect(W * .982, 0, W * .018, H);   // 右框
  ctx.fillRect(W * .5 - W * .006, 0, W * .012, H * .978); // 中竖框

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* --- 点击生成水痕 --- */
window.addEventListener('pointerdown', e => {
  const x = e.clientX / W, y = e.clientY / H;
  drops.push({ x: x, y: y, r: 2 + Math.random() * 3, vy: .04, stuck: false, delay: 0 });
  trails.push({ x: x, y: y, len: 0, r: 2.5 });
});
</script>
</body>
</html>
