<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫咪热气球 · 晨雾里的一次旅行 🐈🎈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #f3e3d6; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }

  .caption {
    position: fixed; left: 0; right: 0; bottom: 30px;
    text-align: center; pointer-events: none;
    animation: fadeUp 2.8s ease both;
  }
  .caption h1 {
    font-size: 20px; font-weight: 600; letter-spacing: 6px;
    color: #fffaf1;
    text-shadow: 0 1px 16px rgba(96,64,50,.55), 0 1px 3px rgba(96,64,50,.5);
  }
  .caption p {
    font-size: 12px; letter-spacing: 2.5px; color: #f6e7d6;
    margin-top: 7px;
    text-shadow: 0 1px 12px rgba(96,64,50,.55);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hint {
    position: fixed; top: 22px; left: 0; right: 0; text-align: center;
    font-size: 11.5px; letter-spacing: 1.5px; color: #9a7b70;
    opacity: .9; pointer-events: none;
    text-shadow: 0 1px 8px rgba(255,255,255,.95);
  }
  body.clean .hint { display: none; }   /* 出图用：?clean=1 去掉操作提示小字 */
  body.clean .caption { animation: none !important; }   /* 出图时署名直接满亮，避免截到淡入中途 */
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint">点一下画面 · 会飘起一圈萤火 ✨</div>
<div class="caption">
  <h1>猫 咪 热 气 球</h1>
  <p>晨雾里的一次旅行 · 一只爱看风景的橘猫</p>
</div>

<script>
if (location.search.includes('clean')) document.body.classList.add('clean');

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* ---------- 确定性随机 ---------- */
const SCENE_SEED = 20261018;
let seed = SCENE_SEED;
function rnd() {
  seed = (seed * 9301 + 49297) % 233280;
  return seed / 233280;
}
function between(a, b) { return a + rnd() * (b - a); }

/* ---------- 离屏静态层 ---------- */
const bg = document.createElement('canvas');
const bx = bg.getContext('2d');

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bg.width = cv.width; bg.height = cv.height;
  bx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintStatic();
}
window.addEventListener('resize', resize);

/* ---------- 小工具 ---------- */
function rrect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ================================================================
   静态层：天空 / 太阳 / 远山 / 草地 / 野花 / 晨雾
   ================================================================ */
function paintStatic() {
  seed = SCENE_SEED;
  const C = bx;
  C.clearRect(0, 0, W, H);

  /* ---- 天空 ---- */
  const sky = C.createLinearGradient(0, 0, 0, H * .82);
  sky.addColorStop(0, '#cfe0ea');
  sky.addColorStop(.34, '#e9e6e2');
  sky.addColorStop(.62, '#f7e3d4');
  sky.addColorStop(1, '#f2cfc2');
  C.fillStyle = sky;
  C.fillRect(0, 0, W, H);

  /* ---- 太阳（低低的一颗，带光晕） ---- */
  const sx = W * .17, sy = H * .30;
  const sunGlow = C.createRadialGradient(sx, sy, 2, sx, sy, H * .26);
  sunGlow.addColorStop(0, 'rgba(255,246,228,.95)');
  sunGlow.addColorStop(.18, 'rgba(255,240,214,.55)');
  sunGlow.addColorStop(.55, 'rgba(255,226,196,.18)');
  sunGlow.addColorStop(1, 'rgba(255,226,196,0)');
  C.fillStyle = sunGlow;
  C.fillRect(0, 0, W, H * .75);
  C.fillStyle = 'rgba(255,244,222,.98)';
  C.beginPath();
  C.arc(sx, sy, H * .052, 0, Math.PI * 2);
  C.fill();
  C.strokeStyle = 'rgba(255,226,180,.85)';
  C.lineWidth = Math.max(1, H * .0022);
  C.stroke();

  /* ---- 远处的云（很淡） ---- */
  function softCloud(cx, cy, w, h, a) {
    C.save();
    C.globalAlpha = a;
    C.fillStyle = '#ffffff';
    C.beginPath();
    C.ellipse(cx, cy, w * .5, h * .5, 0, 0, Math.PI * 2);
    C.fill();
    C.beginPath();
    C.ellipse(cx - w * .26, cy + h * .12, w * .32, h * .38, 0, 0, Math.PI * 2);
    C.fill();
    C.beginPath();
    C.ellipse(cx + w * .28, cy + h * .14, w * .3, h * .34, 0, 0, Math.PI * 2);
    C.fill();
    C.restore();
  }
  softCloud(W * .42, H * .20, W * .16, H * .045, .55);
  softCloud(W * .80, H * .13, W * .13, H * .035, .42);
  softCloud(W * .58, H * .30, W * .10, H * .026, .34);
  softCloud(W * .93, H * .28, W * .11, H * .03, .3);

  /* ---- 远山：三层圆润的山丘 ---- */
  function hillLayer(baseY, amp, color, alpha, bumpFreq, phase) {
    C.save();
    C.globalAlpha = alpha;
    C.fillStyle = color;
    C.beginPath();
    C.moveTo(0, H);
    C.lineTo(0, baseY + Math.sin(phase) * amp * .4);
    for (let x = 0; x <= W; x += W / 60) {
      const t = x / W;
      const y = baseY
        + Math.sin(t * bumpFreq + phase) * amp
        + Math.sin(t * bumpFreq * 2.3 + phase * 1.7) * amp * .38
        + Math.sin(t * bumpFreq * 5.1 + phase * .6) * amp * .12;
      C.lineTo(x, y);
    }
    C.lineTo(W, H);
    C.closePath();
    C.fill();
    C.restore();
  }
  hillLayer(H * .69, H * .042, '#ddd2c1', .95, 2.1, 1.2);    /* 最远，雾里 */
  hillLayer(H * .745, H * .055, '#c3d5b2', 1, 1.6, 3.4);
  hillLayer(H * .80, H * .06, '#a3c190', 1, 2.4, 5.1);
  hillLayer(H * .853, H * .055, '#87a877', 1, 1.9, 2.2);

  /* ---- 远处的小树（几棵就够，给山一点比例感） ---- */
  function smallTree(x, y, s, color) {
    C.fillStyle = color;
    C.beginPath();
    C.ellipse(x, y - s * 1.1, s * .62, s * .95, 0, 0, Math.PI * 2);
    C.fill();
    C.beginPath();
    C.ellipse(x - s * .30, y - s * .55, s * .42, s * .55, 0, 0, Math.PI * 2);
    C.fill();
    C.beginPath();
    C.ellipse(x + s * .32, y - s * .58, s * .40, s * .5, 0, 0, Math.PI * 2);
    C.fill();
    C.strokeStyle = 'rgba(74,96,66,.9)';
    C.lineWidth = Math.max(1, s * .16);
    C.beginPath();
    C.moveTo(x, y - s * .7);
    C.lineTo(x, y);
    C.stroke();
  }
  seed = SCENE_SEED + 5;
  for (let i = 0; i < 9; i++) {
    const tx = W * (.04 + rnd() * .92);
    const ty = H * (.795 + rnd() * .03);
    smallTree(tx, ty, H * (.012 + rnd() * .008), 'rgba(92,120,80,.85)');
  }

  softCloud(W * .16, H * .745, W * .12, H * .022, .30);
  softCloud(W * .72, H * .775, W * .16, H * .026, .26);

  /* ---- 晨雾（贴在山腰） ---- */
  const mist = C.createLinearGradient(0, H * .66, 0, H * .84);
  mist.addColorStop(0, 'rgba(255,245,238,0)');
  mist.addColorStop(.45, 'rgba(255,247,240,.34)');
  mist.addColorStop(1, 'rgba(255,247,240,0)');
  C.fillStyle = mist;
  C.fillRect(0, H * .66, W, H * .18);

  /* ---- 中景草甸（浅色的一条，让远近拉开） ---- */
  C.fillStyle = '#a9c496';
  C.beginPath();
  C.moveTo(0, H);
  C.lineTo(0, H * .875);
  for (let x = 0; x <= W; x += W / 60) {
    const tt = x / W;
    const y = H * .875 + Math.sin(tt * 3.1 + 2.2) * H * .022 + Math.sin(tt * 7.3) * H * .008;
    C.lineTo(x, y);
  }
  C.lineTo(W, H);
  C.closePath();
  C.fill();

  /* 中景草甸的细碎质感 */
  seed = SCENE_SEED + 31;
  for (let i = 0; i < 120; i++) {
    const gx = rnd() * W;
    const gy = H * (.885 + rnd() * .035);
    const gh = H * (.004 + rnd() * .012);
    C.strokeStyle = 'rgba(96,128,86,' + between(.18, .45).toFixed(2) + ')';
    C.lineWidth = Math.max(1, H * .0008);
    C.beginPath();
    C.moveTo(gx, gy);
    C.lineTo(gx + between(-2, 2), gy - gh);
    C.stroke();
  }

  /* ---- 前景草地 ---- */
  const grass = C.createLinearGradient(0, H * .86, 0, H);
  grass.addColorStop(0, '#7d9a72');
  grass.addColorStop(1, '#68865f');
  C.fillStyle = grass;
  C.beginPath();
  C.moveTo(0, H);
  C.lineTo(0, H * .90);
  for (let x = 0; x <= W; x += W / 80) {
    const t = x / W;
    const y = H * .90
      + Math.sin(t * 6.5 + 1.2) * H * .012
      + Math.sin(t * 13.7 + 4.1) * H * .006;
    C.lineTo(x, y);
  }
  C.lineTo(W, H);
  C.closePath();
  C.fill();

  /* 草坡接缝处的薄雾，柔化分层 */
  const seam = C.createLinearGradient(0, H * .855, 0, H * .915);
  seam.addColorStop(0, 'rgba(255,248,238,0)');
  seam.addColorStop(.5, 'rgba(255,248,238,.38)');
  seam.addColorStop(1, 'rgba(255,248,238,0)');
  C.fillStyle = seam;
  C.fillRect(0, H * .855, W, H * .06);

  /* ---- 草叶（几撮，近处大一点） ---- */
  for (let i = 0; i < 160; i++) {
    const t = rnd();
    const x = t * W;
    const base = H * (.905 + rnd() * .09);
    const h = H * (.012 + rnd() * .045) * (0.6 + t * .9);
    const sway = between(-.35, .35) + Math.sin(t * 9) * .15;
    C.strokeStyle = 'rgba(74,104,66,' + between(.35, .8).toFixed(2) + ')';
    C.lineWidth = Math.max(1, H * .0012 * (0.6 + rnd()));
    C.lineCap = 'round';
    C.beginPath();
    C.moveTo(x, base);
    C.quadraticCurveTo(x + sway * h * .4, base - h * .55, x + sway * h, base - h);
    C.stroke();
  }

  /* ---- 小野花 ---- */
  for (let i = 0; i < 26; i++) {
    const x = rnd() * W;
    const y = H * (.90 + rnd() * .08);
    const s = H * (.0035 + rnd() * .003);
    const petalColor = rnd() > .45 ? 'rgba(255,248,240,.92)' : 'rgba(247,206,206,.95)';
    for (let p = 0; p < 5; p++) {
      const a = p / 5 * Math.PI * 2 + rnd() * .3;
      C.fillStyle = petalColor;
      C.beginPath();
      C.ellipse(x + Math.cos(a) * s, y + Math.sin(a) * s * .8, s * .78, s * .5, a, 0, Math.PI * 2);
      C.fill();
    }
    C.fillStyle = '#e8c46a';
    C.beginPath();
    C.arc(x, y, s * .35, 0, Math.PI * 2);
    C.fill();
  }
}

/* ================================================================
   动态层：云飘 / 热气球晃 / 猫 / 萤火
   ================================================================ */
const clouds = [];
function buildClouds() {
  seed = SCENE_SEED + 11;
  clouds.length = 0;
  for (let i = 0; i < 4; i++) {
    clouds.push({
      x: rnd(), y: H * (.12 + rnd() * .18),
      w: W * (.08 + rnd() * .08),
      h: H * (.02 + rnd() * .02),
      sp: (0.0008 + rnd() * 0.0016) * W,   /* px/s */
      a: .25 + rnd() * .3,
    });
  }
}

const flies = [];
function buildFlies() {
  seed = SCENE_SEED + 23;
  flies.length = 0;
}

/* ---------- 画热气球 ---------- */
function drawBalloon(t) {
  const cx = W * .635 + Math.sin(t * .55) * W * .004;
  const cy = H * .375 + Math.sin(t * .8) * H * .008;
  const ew = Math.min(W, H) * .255;       /* 球宽 */
  const eh = ew * 1.16;                   /* 球高 */
  const bob = Math.sin(t * .9) * .01;

  ctx.save();
  ctx.translate(cx, cy);

  /* 球体轮廓（用贝塞尔画一个上宽下收的形状） */
  ctx.beginPath();
  ctx.moveTo(-ew * .5, -eh * .04);
  ctx.bezierCurveTo(-ew * .52, -eh * .62, -ew * .16, -eh * .56, 0, -eh * .56);
  ctx.bezierCurveTo(ew * .16, -eh * .56, ew * .52, -eh * .62, ew * .5, -eh * .04);
  ctx.bezierCurveTo(ew * .47, eh * .26, ew * .18, eh * .38, 0, eh * .40);
  ctx.bezierCurveTo(-ew * .18, eh * .38, -ew * .47, eh * .26, -ew * .5, -eh * .04);
  ctx.closePath();

  /* 底色 */
  const bodyGrad = ctx.createLinearGradient(-ew * .5, -eh * .5, ew * .5, eh * .45);
  bodyGrad.addColorStop(0, '#fbf1e6');
  bodyGrad.addColorStop(.45, '#f6e7d8');
  bodyGrad.addColorStop(1, '#efd6c6');
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  /* 竖条纹（gore） */
  ctx.save();
  ctx.clip();
  const stripes = ['rgba(233,167,160,.92)', 'rgba(246,235,224,.0)', 'rgba(169,195,161,.85)', 'rgba(246,235,224,.0)'];
  for (let i = 0; i < 8; i++) {
    const x0 = -ew * .5 + (i / 8) * ew;
    const x1 = -ew * .5 + ((i + 1) / 8) * ew;
    if (i % 4 === 0) { ctx.fillStyle = 'rgba(233,167,160,.85)'; }
    else if (i % 4 === 2) { ctx.fillStyle = 'rgba(169,195,161,.7)'; }
    else { ctx.fillStyle = 'rgba(255,255,255,0)'; }
    ctx.beginPath();
    ctx.moveTo(x0, -eh * .58);
    ctx.quadraticCurveTo((x0 + x1) / 2 + (x0 - 0) * .15, -eh * .1, x0 * .28, eh * .42);
    ctx.lineTo(x1 * .28, eh * .42);
    ctx.quadraticCurveTo((x0 + x1) / 2 + (x1 - 0) * .15, -eh * .1, x1, -eh * .58);
    ctx.closePath();
    ctx.fill();
  }
  /* 高光 */
  const hl = ctx.createRadialGradient(-ew * .22, -eh * .26, 2, -ew * .22, -eh * .26, ew * .42);
  hl.addColorStop(0, 'rgba(255,255,255,.55)');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl;
  ctx.fillRect(-ew * .5, -eh * .58, ew, eh);
  ctx.restore();

  /* 球口的小裙边 */
  ctx.fillStyle = '#e3c3b2';
  rrect(ctx, -ew * .105, eh * .355, ew * .21, eh * .045, ew * .02);
  ctx.fill();

  /* 绳索 */
  ctx.strokeStyle = 'rgba(120,92,74,.75)';
  ctx.lineWidth = Math.max(1, ew * .006);
  const basketTop = eh * .40 + eh * .16 + bob * eh;
  const basketW = ew * .235;
  ctx.beginPath();
  ctx.moveTo(-ew * .075, eh * .395);
  ctx.lineTo(-basketW * .46, basketTop);
  ctx.moveTo(ew * .075, eh * .395);
  ctx.lineTo(basketW * .46, basketTop);
  ctx.stroke();

  /* ---------- 橘猫（先画，身体藏在篮子里） ---------- */
  const bh = eh * .13;
  const bw = basketW;
  drawCatHead(0, basketTop, bw, t);

  /* 篮子 */
  const bg2 = ctx.createLinearGradient(-bw / 2, basketTop, bw / 2, basketTop + bh);
  bg2.addColorStop(0, '#c08c5c');
  bg2.addColorStop(1, '#a06f45');
  ctx.fillStyle = bg2;
  ctx.beginPath();
  ctx.moveTo(-bw * .5, basketTop);
  ctx.lineTo(bw * .5, basketTop);
  ctx.lineTo(bw * .42, basketTop + bh);
  ctx.lineTo(-bw * .42, basketTop + bh);
  ctx.closePath();
  ctx.fill();

  /* 篮子编织线 */
  ctx.save();
  ctx.strokeStyle = 'rgba(106,70,43,.36)';
  ctx.lineWidth = Math.max(1, ew * .0045);
  for (let i = 1; i < 4; i++) {
    const y = basketTop + bh * i / 4;
    ctx.beginPath();
    ctx.moveTo(-bw * .49 + bw * .02 * i, y);
    ctx.lineTo(bw * .49 - bw * .02 * i, y);
    ctx.stroke();
  }
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(bw * .12 * i, basketTop + 2);
    ctx.lineTo(bw * .105 * i, basketTop + bh - 2);
    ctx.stroke();
  }
  ctx.restore();

  /* 篮子口沿 */
  ctx.fillStyle = '#d8a97a';
  rrect(ctx, -bw * .53, basketTop - bh * .06, bw * 1.06, bh * .14, bh * .07);
  ctx.fill();

  /* 猫爪搭在口沿上 */
  drawCatPaws(0, basketTop - bh * .01, bw, t);

  ctx.restore();
}

/* ---------- 橘猫：头和身体（局部坐标，原点 = 篮口中心） ---------- */
function drawCatHead(cx, cy, bw, t) {
  const u = bw * .44;                       /* 猫的单位尺寸 */
  const headY = -u * 1.42;                  /* 头中心（在篮口上方） */
  const sw = Math.sin(t * 1.4) * .03;

  ctx.save();
  ctx.translate(cx, cy);

  /* 身体（藏在篮子里，只露出一截肩膀） */
  ctx.fillStyle = '#e8a45e';
  ctx.beginPath();
  ctx.ellipse(0, -u * .55, u * .92, u * .72, 0, 0, Math.PI * 2);
  ctx.fill();

  /* 耳朵 */
  const earH = u * .66;
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#e8a45e';
    ctx.beginPath();
    ctx.moveTo(s * u * .44, headY - u * .42);
    ctx.lineTo(s * u * .80, headY - u * .40 - earH * .55);
    ctx.lineTo(s * u * .86, headY + u * .04);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f4c9a8';
    ctx.beginPath();
    ctx.moveTo(s * u * .50, headY - u * .36);
    ctx.lineTo(s * u * .72, headY - u * .34 - earH * .36);
    ctx.lineTo(s * u * .76, headY - u * .02);
    ctx.closePath();
    ctx.fill();
  }

  /* 脑袋 */
  ctx.fillStyle = '#e8a45e';
  ctx.beginPath();
  ctx.ellipse(0, headY, u * .95, u * .82, 0, 0, Math.PI * 2);
  ctx.fill();

  /* 脸上浅色区域 */
  ctx.fillStyle = '#f7ddc2';
  ctx.beginPath();
  ctx.ellipse(0, headY + u * .22, u * .60, u * .46, 0, 0, Math.PI * 2);
  ctx.fill();

  /* 条纹 */
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, headY, u * .95, u * .82, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.strokeStyle = 'rgba(196,127,72,.55)';
  ctx.lineWidth = u * .09;
  ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(i * u * .34, headY - u * .78);
    ctx.quadraticCurveTo(i * u * .40, headY - u * .46, i * u * .30, headY - u * .22);
    ctx.stroke();
  }
  ctx.restore();

  /* 眼睛：眯成两条弯弯的线（看风景很开心） */
  ctx.strokeStyle = '#4a3527';
  ctx.lineWidth = u * .10;
  ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(s * u * .34, headY + u * .04, u * .16, Math.PI * 1.12, Math.PI * 1.88);
    ctx.stroke();
  }

  /* 鼻子 + 嘴 */
  ctx.fillStyle = '#e88f8f';
  ctx.beginPath();
  ctx.moveTo(-u * .075, headY + u * .32);
  ctx.lineTo(u * .075, headY + u * .32);
  ctx.lineTo(0, headY + u * .42);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(74,53,39,.65)';
  ctx.lineWidth = u * .055;
  ctx.beginPath();
  ctx.moveTo(0, headY + u * .42);
  ctx.quadraticCurveTo(0, headY + u * .52, -u * .12, headY + u * .54);
  ctx.moveTo(0, headY + u * .42);
  ctx.quadraticCurveTo(0, headY + u * .52, u * .12, headY + u * .54);
  ctx.stroke();

  /* 胡须（轻轻摆） */
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = u * .035;
  for (const s of [-1, 1]) {
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.moveTo(s * u * .30, headY + u * (.30 + i * .1));
      ctx.quadraticCurveTo(
        s * u * .72, headY + u * (.24 + i * .14) + sw * u,
        s * u * .98, headY + u * (.20 + i * .2));
      ctx.stroke();
    }
  }

  /* 腮红 */
  ctx.fillStyle = 'rgba(240,150,150,.35)';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(s * u * .54, headY + u * .38, u * .17, u * .11, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

/* ---------- 橘猫：两只搭在篮沿上的小爪子 ---------- */
function drawCatPaws(cx, cy, bw, t) {
  const u = bw * .44;
  const sw = Math.sin(t * 1.1) * .02;
  ctx.save();
  ctx.translate(cx, cy);
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#e8a45e';
    ctx.beginPath();
    ctx.ellipse(s * u * .52, sw * u, u * .20, u * .13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(196,127,72,.5)';
    ctx.lineWidth = u * .03;
    ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(s * u * .52 + i * u * .07, sw * u - u * .07);
      ctx.lineTo(s * u * .52 + i * u * .07, sw * u + u * .05);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- 漂浮的云 ---------- */
function drawClouds(t, dt) {
  for (const c of clouds) {
    c.x += (c.sp * dt) / W;
    if (c.x > 1.15) c.x = -0.15;
    const x = c.x * W, y = c.y;
    const w = c.w, h = c.h;
    ctx.save();
    ctx.globalAlpha = c.a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(x, y, w * .5, h * .5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x - w * .24, y + h * .1, w * .32, h * .36, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + w * .26, y + h * .12, w * .3, h * .32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ---------- 萤火 ---------- */
function spawnFireflies(x, y) {
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.max(W, H) * (.02 + Math.random() * .06);
    flies.push({
      x: x + Math.cos(a) * r * .35,
      y: y + Math.sin(a) * r * .35,
      vx: Math.cos(a) * (6 + Math.random() * 14),
      vy: -8 - Math.random() * 16,
      life: 1,
      ph: Math.random() * Math.PI * 2,
      size: Math.max(2, H * .0035 * (0.6 + Math.random())),
    });
  }
}

function drawFireflies(t, dt) {
  for (let i = flies.length - 1; i >= 0; i--) {
    const f = flies[i];
    f.x += f.vx * dt + Math.sin(t * 1.6 + f.ph) * .35;
    f.y += f.vy * dt;
    f.vy -= 3 * dt;
    f.life -= dt * .35;
    if (f.life <= 0) { flies.splice(i, 1); continue; }
    const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 3.2);
    glow.addColorStop(0, 'rgba(255,246,206,' + (f.life * .95) + ')');
    glow.addColorStop(.35, 'rgba(255,226,150,' + (f.life * .5) + ')');
    glow.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 3.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---------- 远处的鸟（剪影） ---------- */
function drawBirds(t) {
  ctx.save();
  ctx.strokeStyle = 'rgba(120,104,96,.45)';
  ctx.lineWidth = Math.max(1, H * .0016);
  ctx.lineCap = 'round';
  const baseX = W * .26, baseY = H * .22;
  for (let i = 0; i < 3; i++) {
    const x = baseX + i * W * .035 + Math.sin(t * .3 + i) * W * .004;
    const y = baseY + i * H * .018 + Math.sin(t * .6 + i * 2) * H * .004;
    const s = H * .008 * (1 - i * .12);
    const flap = Math.sin(t * 3 + i * 1.7) * .5 + .5;
    ctx.beginPath();
    ctx.moveTo(x - s, y + s * .3 * flap);
    ctx.quadraticCurveTo(x - s * .4, y - s * .3 * flap, x, y);
    ctx.quadraticCurveTo(x + s * .4, y - s * .3 * flap, x + s, y + s * .3 * flap);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- 主循环 ---------- */
let last = 0;
function loop(now) {
  const t = now / 1000;
  const dt = Math.min(.05, last ? t - last : .016);
  last = t;

  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bg, 0, 0, W, H);          /* 静态层：结构上不可能动 */
  drawClouds(t, dt);
  drawBirds(t);
  drawBalloon(t);
  drawFireflies(t, dt);

  requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown', e => {
  spawnFireflies(e.clientX, e.clientY);
});

resize();
buildClouds();
buildFlies();
requestAnimationFrame(loop);
</script>
</body>
