<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山间黄昏 · 风景画 🌄</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #1a1024; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }

  .caption {
    position: fixed; left: 0; right: 0; bottom: 28px;
    text-align: center; pointer-events: none;
    animation: fadeUp 2.6s ease both;
  }
  .caption h1 {
    font-size: 19px; font-weight: 600; letter-spacing: 5px;
    color: #ffe9d0;
    text-shadow: 0 0 20px rgba(255,180,110,.6), 0 2px 8px rgba(0,0,0,.5);
  }
  .caption p {
    font-size: 12px; letter-spacing: 2.5px; color: #d8a986;
    margin-top: 7px;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hint {
    position: fixed; top: 22px; left: 0; right: 0; text-align: center;
    font-size: 11.5px; letter-spacing: 1.5px; color: #b98a6e;
    opacity: .85; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint">点一下天空 · 会飞过一群飞鸟 🕊️</div>
<div class="caption">
  <h1>山 间 黄 昏</h1>
  <p>落日 · 云海 · 归鸟</p>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

/* 固定随机种子，保证山形稳定 */
let seed = 20261012;
function rnd() {
  seed = (seed * 9301 + 49297) % 233280;
  return seed / 233280;
}

/* ---------- 云 ---------- */
const clouds = [];
for (let i = 0; i < 9; i++) {
  clouds.push({
    x: rnd(), y: .10 + rnd() * .38,
    w: .16 + rnd() * .26, h: .020 + rnd() * .030,
    sp: .002 + rnd() * .006,
    a: .10 + rnd() * .22,
    hue: rnd() > .5 ? 'warm' : 'cool'
  });
}

/* ---------- 飞鸟 ---------- */
const birds = [];
function spawnBirds(x, y) {
  const n = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    birds.push({
      x: x + (Math.random() - .5) * 60,
      y: y + (Math.random() - .5) * 40,
      vx: .55 + Math.random() * .5,
      vy: -.05 + Math.random() * .1,
      ph: Math.random() * Math.PI * 2,
      s: .6 + Math.random() * .8,
      life: 1
    });
  }
}

/* ---------- 山脊生成 ---------- */
function ridge(baseY, amp, step, color, alpha, tOff) {
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W + step; x += step) {
    const p = x / W;
    const y = baseY
      + Math.sin(p * 6.2 + tOff) * amp
      + Math.sin(p * 13.7 + tOff * 2.1) * amp * .45
      + Math.sin(p * 27.3 + tOff * 3.3) * amp * .18;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------- 主循环 ---------- */
let time = 0, last = performance.now();

function loop(now) {
  const dt = Math.min((now - last) / 1000, .05);
  last = now; time += dt;

  const horizon = H * .62;

  /* --- 天空渐变 --- */
  const sky = ctx.createLinearGradient(0, 0, 0, horizon + 40);
  sky.addColorStop(0,   '#2b1b4a');
  sky.addColorStop(.28, '#6b3a6a');
  sky.addColorStop(.52, '#c2585f');
  sky.addColorStop(.74, '#f08a4b');
  sky.addColorStop(.90, '#ffc46b');
  sky.addColorStop(1,   '#ffe0a3');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, horizon + 40);

  /* --- 星星（高处） --- */
  for (let i = 0; i < 45; i++) {
    const sx = ((i * 137.5) % 100) / 100 * W;
    const sy = ((i * 61.8) % 100) / 100 * horizon * .45;
    const tw = .25 + Math.sin(time * 1.4 + i) * .25;
    if (tw <= 0) continue;
    ctx.fillStyle = `rgba(255,240,220,${tw})`;
    ctx.beginPath();
    ctx.arc(sx, sy, .8 + (i % 3) * .5, 0, Math.PI * 2);
    ctx.fill();
  }

  /* --- 太阳 --- */
  const sunX = W * .72;
  const sunY = horizon - H * .10 + Math.sin(time * .18) * 3;
  const sunR = Math.min(W, H) * .055;

  const halo = ctx.createRadialGradient(sunX, sunY, sunR * .4, sunX, sunY, sunR * 7);
  halo.addColorStop(0, 'rgba(255,220,150,.55)');
  halo.addColorStop(.35, 'rgba(255,170,90,.20)');
  halo.addColorStop(1, 'rgba(255,150,80,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR * 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff3c4';
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  ctx.fill();

  /* --- 云 --- */
  clouds.forEach(c => {
    c.x += c.sp * dt;
    if (c.x > 1.3) c.x = -.3;
    const cx = c.x * W, cy = c.y * H;
    const cw = c.w * W, ch = c.h * H;
    const g = ctx.createLinearGradient(cx, cy - ch, cx, cy + ch);
    if (c.hue === 'warm') {
      g.addColorStop(0, `rgba(255,215,180,${c.a})`);
      g.addColorStop(1, `rgba(255,150,120,${c.a * .5})`);
    } else {
      g.addColorStop(0, `rgba(200,180,220,${c.a * .8})`);
      g.addColorStop(1, `rgba(120,110,160,${c.a * .4})`);
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy, cw, ch, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + cw * .45, cy + ch * .35, cw * .6, ch * .75, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  /* --- 飞鸟 --- */
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.x += b.vx * 60 * dt;
    b.y += b.vy * 60 * dt;
    b.ph += dt * 7;
    if (b.x > W + 40) { birds.splice(i, 1); continue; }
    const flap = Math.sin(b.ph) * .5;
    ctx.strokeStyle = `rgba(60,35,50,${.55 * b.life})`;
    ctx.lineWidth = 1.6 * b.s;
    ctx.lineCap = 'round';
    const w = 7 * b.s;
    ctx.beginPath();
    ctx.moveTo(b.x - w, b.y - flap * 4 * b.s);
    ctx.quadraticCurveTo(b.x - w * .4, b.y + 2 * b.s, b.x, b.y);
    ctx.quadraticCurveTo(b.x + w * .4, b.y + 2 * b.s, b.x + w, b.y - flap * 4 * b.s);
    ctx.stroke();
  }

  /* --- 远山（三层，越远越淡） --- */
  ridge(horizon - H * .055, H * .030, 14, '#7a5a86', .55, 0.4);
  ridge(horizon - H * .020, H * .042, 12, '#5b4270', .75, 1.7);
  ridge(horizon + H * .015, H * .050, 10, '#3a2a52', .92, 3.1);

  /* --- 云海 / 雾带 --- */
  const mist = ctx.createLinearGradient(0, horizon - H * .02, 0, horizon + H * .10);
  mist.addColorStop(0, 'rgba(255,205,160,.42)');
  mist.addColorStop(.5, 'rgba(240,170,140,.22)');
  mist.addColorStop(1, 'rgba(120,90,130,0)');
  ctx.fillStyle = mist;
  ctx.fillRect(0, horizon - H * .02, W, H * .12);

  /* --- 近景山脊 --- */
  ridge(horizon + H * .075, H * .055, 9, '#241a35', 1, 5.2);

  /* --- 前景剪影：小树 --- */
  const treeBase = H * .88;
  ctx.fillStyle = '#140e20';
  ctx.fillRect(W * .12, treeBase - H * .10, 3, H * .10);
  for (let i = 0; i < 5; i++) {
    const ty = treeBase - H * .10 + i * H * .022;
    const tw = (H * .030) * (1 - i * .13);
    ctx.beginPath();
    ctx.moveTo(W * .12 + 1.5, ty);
    ctx.lineTo(W * .12 + 1.5 - tw, ty + H * .030);
    ctx.lineTo(W * .12 + 1.5 + tw, ty + H * .030);
    ctx.closePath();
    ctx.fill();
  }

  /* --- 地面 --- */
  const ground = ctx.createLinearGradient(0, H * .82, 0, H);
  ground.addColorStop(0, 'rgba(20,14,30,0)');
  ground.addColorStop(1, 'rgba(8,5,14,1)');
  ctx.fillStyle = ground;
  ctx.fillRect(0, H * .82, W, H * .18);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* --- 点击放鸟 --- */
window.addEventListener('pointerdown', e => spawnBirds(e.clientX, e.clientY));
</script>
</body>
</html>
