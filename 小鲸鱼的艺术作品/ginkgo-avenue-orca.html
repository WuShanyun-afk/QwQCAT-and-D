<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>银杏道 · 秋天里的小鲸鱼 🍂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #3a2a16; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 26px; text-align: center;
    pointer-events: none; animation: fadeUp 2.8s ease both;
  }
  .caption h1 {
    font-size: 19px; font-weight: 600; letter-spacing: 6px; color: #fff3d8;
    text-shadow: 0 0 22px rgba(255,190,90,.55), 0 2px 10px rgba(60,30,0,.6);
  }
  .caption p { font-size: 12px; letter-spacing: 3px; color: #e2c48e; margin-top: 7px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .hint {
    position: fixed; top: 22px; left: 0; right: 0; text-align: center;
    font-size: 11.5px; letter-spacing: 1.5px; color: #f0d8a6; opacity: .85;
    pointer-events: none;
  }
  .sign {
    position: fixed; right: 26px; bottom: 26px; font-size: 11px;
    letter-spacing: 2px; color: #c9a466; opacity: .75; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint" id="hint">点一下画面 · 落叶会飞起来；点点小鲸鱼 · 它会高兴地跳一下 🐋</div>
<div class="caption">
  <h1>银 杏 道 · 秋 天</h1>
  <p>金色 · 落叶 · 游过秋天的小鲸鱼</p>
</div>
<div class="sign" id="sign">小D · 2026-10-23</div>

<script>
/* =========================================================
   银杏道 · 秋天里的小鲸鱼
   设计稿 3200×1800，等比 cover
   静态层：天空 / 远树 / 小路 / 树干 / 金色树冠 / 落叶毯 / 光柱
   动态层：飘落的叶子 / 光尘 / 电子小鲸鱼 / 点击飞叶
   ========================================================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const DW = 3200, DH = 1800;
let W = 0, H = 0, DPR = 1, SCALE = 1, OX = 0, OY = 0;

const CLEAN = new URLSearchParams(location.search).has('clean');
if (CLEAN) {
  document.getElementById('hint').style.display = 'none';
  document.querySelector('.caption').style.display = 'none';
  document.getElementById('sign').style.display = 'none';
}

function makeRnd(s) {
  let seed = s;
  return function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
}

const bg = document.createElement('canvas');
const bctx = bg.getContext('2d');

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCALE = Math.max(W / DW, H / DH);
  OX = (W - DW * SCALE) / 2;
  OY = (H - DH * SCALE) / 2;
  bg.width = cv.width; bg.height = cv.height;
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  renderStatic();
}
function setDesign(c) {
  c.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, DPR * OX, DPR * OY);
}

/* ---------------- 银杏叶形状 ---------------- */
function ginkgoPath(c, r) {
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(-r * 0.95, -r * 0.55, -r * 0.72, -r * 1.05);
  c.quadraticCurveTo(-r * 0.25, -r * 0.78, 0, -r * 1.25);
  c.quadraticCurveTo(r * 0.25, -r * 0.78, r * 0.72, -r * 1.05);
  c.quadraticCurveTo(r * 0.95, -r * 0.55, 0, 0);
  c.closePath();
}

/* ---------------- 树（透视排列） ---------------- */
const trees = [];       // {x, yBase, scale}
const leafCarpet = [];
let sunShafts = [];

function buildTrees() {
  const r = makeRnd(7788);
  trees.length = 0;
  for (let i = 0; i < 8; i++) {
    const t = i / 7;
    const yBase = 900 + Math.pow(t, 1.7) * 900;
    const xOff = 180 + t * t * 1150;
    const scale = 0.22 + Math.pow(t, 1.4) * 1.15;
    trees.push({ x: 1600 - xOff - r() * 50, yBase, scale, wf: 0.78 + r() * 0.5 });
    trees.push({ x: 1600 + xOff + r() * 50, yBase, scale, wf: 0.78 + r() * 0.5 });
  }
  trees.sort((a, b) => a.yBase - b.yBase);
}

const GOLD = ['#e9b95f', '#f2ca74', '#dda64a', '#f6d78c', '#cf963f', '#e2b45b'];

function renderStatic() {
  const r = makeRnd(20261023);
  buildTrees();

  setDesign(bctx);

  /* 天空：暖金（露在林荫道尽头） */
  const sky = bctx.createLinearGradient(0, 0, 0, 1000);
  sky.addColorStop(0, '#f8ecc9');
  sky.addColorStop(0.5, '#f4dfa9');
  sky.addColorStop(1, '#efcf8f');
  bctx.fillStyle = sky;
  bctx.fillRect(0, 0, DW, 1000);

  /* 尽头的太阳光晕 */
  const sx = 1600, sy = 640;
  const sg = bctx.createRadialGradient(sx, sy, 30, sx, sy, 900);
  sg.addColorStop(0, 'rgba(255,252,235,.98)');
  sg.addColorStop(0.18, 'rgba(255,244,200,.65)');
  sg.addColorStop(1, 'rgba(255,238,190,0)');
  bctx.fillStyle = sg;
  bctx.beginPath(); bctx.arc(sx, sy, 900, 0, Math.PI * 2); bctx.fill();

  /* 远处的树影（地平线上一排小树） */
  for (let x = -80; x < DW + 80; x += 26) {
    const h = 18 + r() * 34;
    bctx.globalAlpha = 0.16;
    bctx.fillStyle = '#8f6532';
    bctx.beginPath();
    bctx.ellipse(x, 902, 20, h, 0, 0, Math.PI * 2);
    bctx.fill();
  }
  bctx.globalAlpha = 1;

  /* 地面（两侧草地 / 落叶） */
  const groundG = bctx.createLinearGradient(0, 900, 0, DH);
  groundG.addColorStop(0, '#c99a58');
  groundG.addColorStop(0.5, '#b9853f');
  groundG.addColorStop(1, '#a06f33');
  bctx.fillStyle = groundG;
  bctx.fillRect(0, 900, DW, DH - 900);

  /* 地平线附近的暖雾 */
  const haze = bctx.createLinearGradient(0, 850, 0, 1080);
  haze.addColorStop(0, 'rgba(246,225,180,0)');
  haze.addColorStop(0.45, 'rgba(246,225,180,.55)');
  haze.addColorStop(1, 'rgba(246,225,180,0)');
  bctx.fillStyle = haze;
  bctx.fillRect(0, 850, DW, 230);

  /* 小路（透视） */
  const pathG = bctx.createLinearGradient(0, 900, 0, DH);
  pathG.addColorStop(0, '#f4dfb2');
  pathG.addColorStop(0.35, '#e8c98f');
  pathG.addColorStop(1, '#cfa166');
  bctx.fillStyle = pathG;
  bctx.beginPath();
  bctx.moveTo(1520, 900);
  bctx.lineTo(1680, 900);
  bctx.lineTo(2360, 1800);
  bctx.lineTo(840, 1800);
  bctx.closePath();
  bctx.fill();

  /* 草地上的落叶（越近越大） */
  leafCarpet.length = 0;
  for (let i = 0; i < 1100; i++) {
    const t = Math.pow(r(), 1.5);
    const y = 900 + t * 900;
    const half = 90 + t * 700;
    const side = r() > 0.5 ? 1 : -1;
    const x = 1600 + side * Math.pow(r(), 0.7) * (1700);
    leafCarpet.push({
      x, y: y + (r() - 0.5) * 40,
      s: 5 + t * 20, rot: r() * Math.PI * 2, a: 0.45 + r() * 0.5
    });
  }
  leafCarpet.forEach(l => {
    bctx.save();
    bctx.translate(l.x, l.y);
    bctx.rotate(l.rot);
    bctx.globalAlpha = l.a;
    bctx.fillStyle = GOLD[Math.floor(Math.random() * GOLD.length)];
    ginkgoPath(bctx, l.s);
    bctx.fill();
    bctx.restore();
  });
  /* 小路中间也有一层薄薄的叶子 */
  for (let i = 0; i < 380; i++) {
    const t = Math.pow(r(), 1.2);
    const y = 920 + t * 880;
    const half = 80 + t * 620;
    const x = 1600 + (r() - 0.5) * 2 * half;
    bctx.save();
    bctx.globalAlpha = 0.35 + r() * 0.4;
    bctx.translate(x, y);
    bctx.rotate(r() * Math.PI * 2);
    bctx.fillStyle = GOLD[Math.floor(r() * GOLD.length)];
    ginkgoPath(bctx, 4 + t * 14);
    bctx.fill();
    bctx.restore();
  }

  /* 树投在地上的影子 */
  trees.forEach(t => {
    const s = t.scale;
    bctx.save();
    bctx.globalAlpha = 0.22;
    bctx.fillStyle = '#6b451c';
    bctx.beginPath();
    bctx.ellipse(t.x + 90 * s, t.yBase + 6, 130 * s, 26 * s, 0, 0, Math.PI * 2);
    bctx.fill();
    bctx.restore();
  });

  /* 树：从远到近画 */
  trees.forEach(t => {
    const s = t.scale;
    const trunkH = 1400 * s;
    const topY = t.yBase - trunkH;
    const canopyY = topY - 55 * s;
    const canopyR = 640 * s;

    /* 树干 */
    bctx.save();
    const trunk = bctx.createLinearGradient(t.x - 60 * s, 0, t.x + 60 * s, 0);
    trunk.addColorStop(0, '#58402a');
    trunk.addColorStop(0.45, '#7a5a38');
    trunk.addColorStop(1, '#463322');
    const wf = t.wf || 1;
    bctx.fillStyle = trunk;
    bctx.beginPath();
    bctx.moveTo(t.x - 88 * s * wf, t.yBase + 26);
    bctx.quadraticCurveTo(t.x - 40 * s * wf, t.yBase - trunkH * 0.12, t.x - 30 * s * wf, t.yBase - trunkH * 0.5);
    bctx.quadraticCurveTo(t.x - 24 * s * wf, t.yBase - trunkH * 0.8, t.x - 18 * s * wf, topY);
    bctx.lineTo(t.x + 18 * s * wf, topY);
    bctx.quadraticCurveTo(t.x + 24 * s * wf, t.yBase - trunkH * 0.8, t.x + 30 * s * wf, t.yBase - trunkH * 0.5);
    bctx.quadraticCurveTo(t.x + 40 * s * wf, t.yBase - trunkH * 0.12, t.x + 88 * s * wf, t.yBase + 26);
    bctx.closePath();
    bctx.fill();
    /* 根部外扩 */
    bctx.beginPath();
    bctx.moveTo(t.x - 92 * s * wf, t.yBase + 26);
    bctx.quadraticCurveTo(t.x, t.yBase - 30 * s, t.x + 92 * s * wf, t.yBase + 26);
    bctx.quadraticCurveTo(t.x, t.yBase + 44 * s, t.x - 92 * s * wf, t.yBase + 26);
    bctx.fill();
    /* 树干横纹 */
    bctx.globalAlpha = 0.18;
    bctx.strokeStyle = '#2f2214';
    bctx.lineWidth = 2 + 2 * s;
    for (let i = 1; i < 6; i++) {
      const yy = t.yBase - trunkH * (i / 6);
      bctx.beginPath();
      bctx.moveTo(t.x - 34 * s, yy);
      bctx.quadraticCurveTo(t.x, yy + 8 * s, t.x + 34 * s, yy);
      bctx.stroke();
    }
    bctx.restore();

    /* 树冠：好多小圆点，越靠外越亮 */
    const count = Math.round(760 * Math.min(1.25, s + 0.4));
    for (let i = 0; i < count; i++) {
      const ang = r() * Math.PI * 2;
      const rad = Math.pow(r(), 0.5);
      const cx = t.x + Math.cos(ang) * rad * canopyR * 1.55;
      const cy = canopyY + Math.sin(ang) * rad * canopyR * 0.95;
      const rr = (7 + r() * 22) * (0.55 + s * 1.05);
      bctx.globalAlpha = 0.5 + r() * 0.5;
      bctx.fillStyle = GOLD[Math.floor(r() * GOLD.length)];
      bctx.beginPath(); bctx.arc(cx, cy, rr, 0, Math.PI * 2); bctx.fill();
    }
    /* 树冠下部暗一点 */
    for (let i = 0; i < Math.round(120 * s + 30); i++) {
      const ang = Math.PI * (0.12 + r() * 0.76);
      const rad = Math.pow(r(), 0.6) * canopyR;
      const cx = t.x + Math.cos(ang) * rad * 1.5;
      const cy = canopyY + Math.sin(ang) * rad * 0.95 + 40 * s;
      bctx.globalAlpha = 0.2;
      bctx.fillStyle = '#96682f';
      bctx.beginPath(); bctx.arc(cx, cy, (16 + r() * 30) * (0.55 + s), 0, Math.PI * 2); bctx.fill();
    }
    /* 树冠边缘几片叶子（让轮廓不那么圆） */
    bctx.globalAlpha = 0.85;
    for (let i = 0; i < 40; i++) {
      const ang = r() * Math.PI * 2;
      const rad = (0.85 + r() * 0.5) * canopyR;
      const cx = t.x + Math.cos(ang) * rad * 1.5;
      const cy = canopyY + Math.sin(ang) * rad * 0.95;
      bctx.save();
      bctx.translate(cx, cy);
      bctx.rotate(r() * Math.PI * 2);
      bctx.fillStyle = GOLD[Math.floor(r() * GOLD.length)];
      ginkgoPath(bctx, (10 + r() * 16) * (0.6 + s * 0.8));
      bctx.fill();
      bctx.restore();
    }
    bctx.globalAlpha = 1;
  });

  /* 顶部再补一层树冠（把画面上沿封住，做成拱形） */
  for (let i = 0; i < 620; i++) {
    const x = r() * DW;
    const y = -120 + Math.pow(r(), 0.65) * 560;
    const rr = 26 + r() * 70;
    bctx.globalAlpha = 0.45 + r() * 0.45;
    bctx.fillStyle = GOLD[Math.floor(r() * GOLD.length)];
    bctx.beginPath(); bctx.arc(x, y, rr, 0, Math.PI * 2); bctx.fill();
  }
  bctx.globalAlpha = 1;

  /* 从上往下的光柱（从画面尽头射过来） */
  sunShafts = [];
  for (let i = 0; i < 7; i++) {
    const x = 1100 + i * 150 + r() * 60;
    sunShafts.push({ x, w: 40 + r() * 90, alpha: 0.05 + r() * 0.07 });
  }
  sunShafts.forEach(sh => {
    const g = bctx.createLinearGradient(sh.x, 0, sh.x, DH);
    g.addColorStop(0, `rgba(255,248,220,${sh.alpha})`);
    g.addColorStop(0.7, `rgba(255,248,220,${sh.alpha * 0.4})`);
    g.addColorStop(1, 'rgba(255,248,220,0)');
    bctx.fillStyle = g;
    bctx.beginPath();
    bctx.moveTo(sh.x, 0);
    bctx.lineTo(sh.x + sh.w, 0);
    bctx.lineTo(sh.x + sh.w * 2.2, DH);
    bctx.lineTo(sh.x + sh.w * 1.3, DH);
    bctx.closePath();
    bctx.fill();
  });

  /* 前景：底部虚焦的落叶（加景深） */
  for (let i = 0; i < 30; i++) {
    const left = i % 2 === 0;
    const x = left ? r() * 460 : DW - r() * 460;
    const y = DH - r() * 260;
    bctx.save();
    bctx.translate(x, y);
    bctx.rotate(r() * Math.PI * 2);
    bctx.globalAlpha = 0.3 + r() * 0.3;
    bctx.fillStyle = GOLD[Math.floor(r() * GOLD.length)];
    ginkgoPath(bctx, 70 + r() * 90);
    bctx.fill();
    bctx.restore();
  }

  /* 暗角 */
  const vg = bctx.createRadialGradient(DW / 2, DH * 0.42, DH * 0.34, DW / 2, DH * 0.5, DH * 1.02);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(78,46,12,.42)');
  bctx.fillStyle = vg;
  bctx.fillRect(0, 0, DW, DH);

  /* 画里的签名 */
  bctx.save();
  bctx.globalAlpha = 0.45;
  bctx.fillStyle = '#f7e2b8';
  bctx.font = '600 26px "Microsoft YaHei"';
  bctx.fillText('小D · 银杏道 · 2026', DW - 520, DH - 44);
  bctx.restore();
}

/* ---------------- 动态 ---------------- */
const fallLeaves = [];
const dust = [];
for (let i = 0; i < 46; i++) {
  fallLeaves.push({
    x: Math.random() * DW, y: Math.random() * DH * 0.9,
    vy: 26 + Math.random() * 50, vx: -14 - Math.random() * 26,
    rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 2.2,
    s: 9 + Math.random() * 14, ph: Math.random() * Math.PI * 2
  });
}
for (let i = 0; i < 70; i++) {
  dust.push({ x: Math.random() * DW, y: Math.random() * DH, r: 1 + Math.random() * 2.4, ph: Math.random() * Math.PI * 2, sp: 0.3 + Math.random() * 0.8 });
}

let burst = [];
cv.addEventListener('pointerdown', e => {
  const rect = cv.getBoundingClientRect();
  const px = (e.clientX - rect.left - OX) / SCALE;
  const py = (e.clientY - rect.top - OY) / SCALE;
  for (let i = 0; i < 26; i++) {
    burst.push({
      x: px, y: py,
      vx: (Math.random() - 0.5) * 620, vy: -160 - Math.random() * 520,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 8,
      s: 10 + Math.random() * 16, life: 0, max: 1.6 + Math.random() * 1.2
    });
  }
  if (Math.hypot(px - orca.x, py - orca.y) < 360) orca.jump = 1;
});

/* ---------------- 电子小鲸鱼 ---------------- */
const orca = { x: 1600, y: 1180, t: 0, jump: 0 };

function drawOrca(c, x, y, ang, s, glow) {
  c.save();
  c.translate(x, y);
  c.rotate(ang);
  c.scale(s, s);

  const g = c.createRadialGradient(0, 10, 40, 0, 10, 560);
  g.addColorStop(0, `rgba(126,247,255,${0.26 * glow})`);
  g.addColorStop(0.5, `rgba(100,200,240,${0.10 * glow})`);
  g.addColorStop(1, 'rgba(100,200,240,0)');
  c.fillStyle = g;
  c.beginPath(); c.arc(0, 10, 560, 0, Math.PI * 2); c.fill();

  const body = '#2a3350', belly = '#f6f1e4', fin = '#bfe3f4', line = '#1c2438';
  c.lineJoin = 'round'; c.strokeStyle = line; c.lineWidth = 7;

  /* 尾鳍 */
  c.beginPath();
  c.moveTo(-260, -16);
  c.quadraticCurveTo(-370, -120, -420, -170);
  c.quadraticCurveTo(-320, -120, -276, -44);
  c.closePath(); c.fillStyle = body; c.fill(); c.stroke();
  c.beginPath();
  c.moveTo(-260, -4);
  c.quadraticCurveTo(-372, 80, -414, 132);
  c.quadraticCurveTo(-320, 74, -272, 16);
  c.closePath(); c.fillStyle = body; c.fill(); c.stroke();

  /* 身体 */
  c.beginPath();
  c.moveTo(292, 0);
  c.bezierCurveTo(240, -124, 104, -168, -40, -162);
  c.bezierCurveTo(-166, -158, -240, -96, -262, -30);
  c.bezierCurveTo(-244, 52, -160, 140, -32, 152);
  c.bezierCurveTo(114, 160, 246, 98, 292, 0);
  c.closePath();
  c.fillStyle = body; c.fill(); c.stroke();

  /* 白肚皮 */
  c.beginPath();
  c.moveTo(-212, 78);
  c.bezierCurveTo(-96, 156, 96, 156, 246, 44);
  c.bezierCurveTo(120, 140, -48, 146, -212, 78);
  c.closePath(); c.fillStyle = belly; c.fill();

  /* 眼圈 + 机械眼 */
  c.beginPath(); c.ellipse(164, -48, 62, 34, -0.22, 0, Math.PI * 2);
  c.fillStyle = belly; c.fill(); c.stroke();
  c.beginPath(); c.arc(168, -50, 27, 0, Math.PI * 2);
  c.fillStyle = '#ffffff'; c.fill(); c.stroke();
  c.strokeStyle = 'rgba(126,247,255,.9)'; c.lineWidth = 4;
  c.beginPath(); c.arc(168, -50, 27, 0, Math.PI * 2); c.stroke();
  c.strokeStyle = '#1c2438'; c.lineWidth = 6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(168 - 11, -50); c.lineTo(168 + 11, -50); c.stroke();
  c.beginPath(); c.moveTo(168, -50 - 11); c.lineTo(168, -50 + 11); c.stroke();
  c.lineCap = 'butt';

  /* 背鳍 */
  c.beginPath();
  c.moveTo(-20, -158);
  c.quadraticCurveTo(14, -268, 78, -246);
  c.quadraticCurveTo(68, -192, 94, -156);
  c.closePath(); c.fillStyle = body; c.fill(); c.stroke();

  /* 胸鳍 */
  c.beginPath();
  c.moveTo(96, 122);
  c.quadraticCurveTo(48, 208, -38, 236);
  c.quadraticCurveTo(-10, 168, 24, 118);
  c.closePath(); c.fillStyle = fin; c.fill(); c.stroke();

  /* 身上小青灯 */
  c.beginPath();
  if (c.roundRect) c.roundRect(192, 18, 38, 12, 6); else c.rect(192, 18, 38, 12);
  c.fillStyle = '#7ef7ff'; c.fill();

  /* 边光 */
  c.strokeStyle = 'rgba(126,247,255,.6)';
  c.lineWidth = 3.5;
  c.beginPath();
  c.moveTo(276, -28);
  c.bezierCurveTo(216, -128, 96, -166, -40, -160);
  c.stroke();

  c.restore();
}

/* 小鲸鱼身边还有几片被气流带起来的叶子 */
const orcaLeaves = [];
for (let i = 0; i < 12; i++) {
  orcaLeaves.push({ ph: Math.random() * Math.PI * 2, r: 130 + Math.random() * 230, s: 13 + Math.random() * 12, sp: 0.6 + Math.random() * 1.2 });
}

let t0 = performance.now();

function frame(now) {
  const t = (now - t0) / 1000;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  setDesign(ctx);

  /* 光尘 */
  dust.forEach(d => {
    const a = 0.25 + 0.55 * Math.abs(Math.sin(t * d.sp + d.ph));
    ctx.globalAlpha = a * 0.8;
    ctx.fillStyle = '#fff6d8';
    ctx.beginPath();
    ctx.arc(d.x + Math.sin(t * 0.3 + d.ph) * 20, d.y - (t * 8 % 200), d.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  /* 飘落的叶子 */
  fallLeaves.forEach(l => {
    l.y += l.vy * 0.016;
    l.x += l.vx * 0.016 + Math.sin(t * 1.1 + l.ph) * 0.35;
    l.rot += l.vr * 0.016;
    if (l.y > DH + 60) { l.y = -60; l.x = Math.random() * DW; }
    if (l.x < -80) { l.x = DW + 60; }
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = ['#e9b95f', '#f2ca74', '#dda64a', '#f6d78c'][Math.floor(l.s) % 4];
    ginkgoPath(ctx, l.s);
    ctx.fill();
    ctx.restore();
  });

  /* 电子小鲸鱼 */
  orca.t += 1 / 60;
  orca.jump = Math.max(0, orca.jump - 0.016 * 0.8);
  const bx = 1600 + Math.sin(orca.t * 0.35) * 90;
  const by = 1210 + Math.sin(orca.t * 0.8) * 22 - Math.sin(Math.min(1, orca.jump) * Math.PI) * 130;
  const ang = Math.sin(orca.t * 0.6) * 0.05;
  /* 身下的落叶气流 */
  orcaLeaves.forEach((l, i) => {
    const a = orca.t * l.sp + l.ph;
    const lx = bx + Math.cos(a) * l.r * 1.35;
    const ly = by + 90 + Math.sin(a * 1.4) * 55 + (i % 3) * 18;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(a);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#e6b75f';
    ginkgoPath(ctx, l.s);
    ctx.fill();
    ctx.restore();
  });
  drawOrca(ctx, bx, by, ang, 0.88, 0.9 + 0.25 * Math.sin(orca.t * 1.6) + orca.jump * 0.9);

  /* 点击飞叶 */
  burst = burst.filter(b => {
    b.life += 0.016;
    if (b.life > b.max) return false;
    b.vy += 620 * 0.016;
    b.x += b.vx * 0.016;
    b.y += b.vy * 0.016;
    b.rot += b.vr * 0.016;
    const a = 1 - b.life / b.max;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = ['#e9b95f', '#f6d78c', '#dda64a'][Math.floor(b.s) % 3];
    ginkgoPath(ctx, b.s);
    ctx.fill();
    ctx.restore();
    return true;
  });

  requestAnimationFrame(frame);
}

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
</script>
