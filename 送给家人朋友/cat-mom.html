<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>送给我最爱的妈咪 · 小猫咪 🐱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 18px;
    background: linear-gradient(180deg, #ffe9f0 0%, #ffe0d0 55%, #ffd6e6 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #6b4a55; overflow: hidden; user-select: none;
  }

  /* ---------- 开场礼物页 ---------- */
  #gift {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: linear-gradient(180deg, #fff2f6 0%, #ffe3ec 100%);
    transition: opacity .6s ease;
  }
  #gift.gone { opacity: 0; pointer-events: none; }
  .gift-box { font-size: 76px; animation: shake 1.6s ease-in-out infinite; }
  @keyframes shake {
    0%, 100% { transform: rotate(-6deg) scale(1); }
    50%      { transform: rotate(6deg) scale(1.08); }
  }
  .gift-title { font-size: 21px; font-weight: 700; letter-spacing: 2px; color: #d1487a; }
  .gift-sub { font-size: 13px; opacity: .65; letter-spacing: 1px; }
  .gift-btn {
    margin-top: 6px; padding: 14px 40px; border: none; border-radius: 999px;
    font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff8fb1, #ff6b9d);
    box-shadow: 0 10px 22px rgba(255,107,157,.45);
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{ transform: scale(1) } 50%{ transform: scale(1.05) } }

  /* ---------- 主界面 ---------- */
  .card {
    width: 100%; max-width: 380px;
    background: rgba(255,255,255,.62);
    border: 2px solid rgba(255,255,255,.9);
    border-radius: 30px;
    padding: 16px 16px 18px;
    box-shadow: 0 16px 40px rgba(214,120,150,.22);
    backdrop-filter: blur(6px);
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }

  .title { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #d1487a; }
  .title span { font-size: 12px; font-weight: 400; color: #b98a9a; letter-spacing: 0; }

  .stage { position: relative; width: 100%; }

  /* 好感度条 */
  .bar-wrap { width: 100%; display: flex; align-items: center; gap: 8px; }
  .bar-label { font-size: 12px; color: #b98a9a; white-space: nowrap; }
  .bar {
    flex: 1; height: 14px; border-radius: 999px; overflow: hidden;
    background: #ffe3ec; box-shadow: inset 0 2px 4px rgba(214,120,150,.18);
  }
  .bar-fill {
    height: 100%; width: 30%; border-radius: 999px;
    background: linear-gradient(90deg, #ffc2d6, #ff6b9d);
    transition: width .35s ease;
  }

  /* 按钮 */
  .btns { display: flex; gap: 10px; width: 100%; }
  .btn {
    flex: 1; padding: 11px 4px; border: none; border-radius: 18px; cursor: pointer;
    font-size: 13px; font-weight: 700; color: #a04a68;
    background: #fff0f5; box-shadow: 0 4px 12px rgba(214,120,150,.18);
    transition: transform .12s ease, background .2s ease;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .btn:active { transform: scale(.93); background: #ffe0ea; }
  .btn .ico { font-size: 19px; }

  /* 气泡话 */
  .say {
    position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
    background: #fff; border-radius: 16px; padding: 8px 15px;
    font-size: 13px; color: #d1487a; white-space: nowrap;
    box-shadow: 0 6px 16px rgba(214,120,150,.2);
    opacity: 0; transition: opacity .3s ease; pointer-events: none; z-index: 5;
  }
  .say.show { opacity: 1; }

  .tip { font-size: 12px; color: #b98a9a; letter-spacing: 1px; }

  /* 漂浮爱心层 */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .heart { position: absolute; font-size: 24px; animation: floatUp 1.5s ease-out forwards; }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(.6) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-110px) scale(1.3) rotate(20deg); }
  }
  .confetti {
    position: absolute; width: 9px; height: 14px; border-radius: 3px;
    animation: fall 2.6s linear forwards;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(105vh) rotate(720deg); }
  }
  .zzz { position: absolute; font-size: 18px; color: #9b8ad1; animation: zzzUp 2.4s ease-out infinite; }
  @keyframes zzzUp {
    0%   { opacity: 0; transform: translate(0,0) scale(.6); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: translate(26px,-58px) scale(1.15); }
  }

  /* 猫咪动画 */
  .cat { width: 100%; display: block; cursor: pointer; animation: breatheCat 3.4s ease-in-out infinite; }
  @keyframes breatheCat { 0%,100%{ transform: translateY(0) scale(1) } 50%{ transform: translateY(-4px) scale(1.015) } }
  .tail { transform-origin: 226px 236px; animation: wag 2.2s ease-in-out infinite; }
  @keyframes wag { 0%,100%{ transform: rotate(-8deg) } 50%{ transform: rotate(10deg) } }
  .eyes-open  { transition: opacity .15s ease; }
  .eyes-happy { opacity: 0; transition: opacity .15s ease; }
  .cat.petted .eyes-open  { opacity: 0; }
  .cat.petted .eyes-happy { opacity: 1; }
  .cat.sleepy .eyes-open  { opacity: 0; }
  .cat.sleepy .eyes-happy { opacity: 1; }
  .cat.jump { animation: jump .5s ease; }
  @keyframes jump { 0%,100%{ transform: translateY(0) } 45%{ transform: translateY(-26px) } }
  .paw-l { transform-origin: 132px 246px; }
  .paw-r { transform-origin: 188px 246px; }
  .cat.wave .paw-r { animation: wave .5s ease 3; }
  @keyframes wave { 0%,100%{ transform: rotate(0) } 50%{ transform: rotate(-24deg) } }
</style>
</head>
<body>
<!-- 开场礼物 -->
<div id="gift">
  <div class="gift-box">🎁</div>
  <div class="gift-title">送给最爱的妈咪</div>
  <div class="gift-sub">里面住着一只小猫咪，等你来摸摸它</div>
  <button class="gift-btn" id="openBtn">拆开礼物 🐾</button>
</div>

<!-- 主界面 -->
<div class="card">
  <div class="title">🐱 我的小猫咪 <span>· 给妈咪的专属版</span></div>

  <div class="stage">
    <div class="say" id="say">喵~</div>

    <svg class="cat" id="cat" viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ffd9a8"/>
          <stop offset="100%" stop-color="#f0ab6b"/>
        </linearGradient>
        <linearGradient id="bodyGrad2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ffd2a0"/>
          <stop offset="100%" stop-color="#e79c5c"/>
        </linearGradient>
        <radialGradient id="pinkGrad" cx="45%" cy="35%" r="70%">
          <stop offset="0%"   stop-color="#ffd0dd"/>
          <stop offset="100%" stop-color="#ff9fbc"/>
        </radialGradient>
      </defs>

      <!-- 尾巴 -->
      <g class="tail">
        <path d="M224 236 C 268 246, 292 206, 274 176 C 266 162, 248 166, 252 182"
              stroke="url(#bodyGrad2)" stroke-width="17" stroke-linecap="round" fill="none"/>
        <path d="M258 186 C 256 176, 266 170, 272 176"
              stroke="#fff3e2" stroke-width="11" stroke-linecap="round" fill="none" opacity=".9"/>
      </g>

      <!-- 身体 -->
      <ellipse cx="160" cy="208" rx="60" ry="54" fill="url(#bodyGrad2)"/>
      <ellipse cx="160" cy="220" rx="34" ry="38" fill="#fff3e2" opacity=".85"/>

      <!-- 前爪 -->
      <ellipse class="paw-l" cx="132" cy="250" rx="20" ry="14" fill="#fff3e2"/>
      <ellipse class="paw-r" cx="188" cy="250" rx="20" ry="14" fill="#fff3e2"/>
      <g fill="#f3a9bd" opacity=".85">
        <circle cx="124" cy="247" r="2.4"/><circle cx="132" cy="245" r="2.4"/><circle cx="140" cy="247" r="2.4"/>
        <circle cx="180" cy="247" r="2.4"/><circle cx="188" cy="245" r="2.4"/><circle cx="196" cy="247" r="2.4"/>
      </g>

      <!-- 耳朵 -->
      <path d="M108 106 L100 50 L150 82 Z" fill="url(#furGrad)"/>
      <path d="M212 106 L220 50 L170 82 Z" fill="url(#furGrad)"/>
      <path d="M114 98 L110 64 L140 82 Z" fill="url(#pinkGrad)"/>
      <path d="M206 98 L210 64 L180 82 Z" fill="url(#pinkGrad)"/>

      <!-- 头 -->
      <ellipse cx="160" cy="132" rx="66" ry="58" fill="url(#furGrad)"/>

      <!-- 虎斑纹 -->
      <g stroke="#e09152" stroke-width="4" stroke-linecap="round" opacity=".55" fill="none">
        <path d="M160 76 v 16"/>
        <path d="M138 80 l 5 15"/>
        <path d="M182 80 l -5 15"/>
      </g>

      <!-- 眼睛（睁着） -->
      <g class="eyes-open">
        <ellipse cx="136" cy="130" rx="10" ry="13" fill="#4a3038"/>
        <ellipse cx="184" cy="130" rx="10" ry="13" fill="#4a3038"/>
        <circle cx="139" cy="124" r="4" fill="#fff"/>
        <circle cx="187" cy="124" r="4" fill="#fff"/>
        <circle cx="133" cy="135" r="2" fill="#fff" opacity=".7"/>
        <circle cx="181" cy="135" r="2" fill="#fff" opacity=".7"/>
      </g>
      <!-- 眼睛（眯眼笑） -->
      <g class="eyes-happy">
        <path d="M124 132 q 12 -14 24 0" stroke="#4a3038" stroke-width="5"
              stroke-linecap="round" fill="none"/>
        <path d="M172 132 q 12 -14 24 0" stroke="#4a3038" stroke-width="5"
              stroke-linecap="round" fill="none"/>
      </g>

      <!-- 鼻子 + 嘴 -->
      <path d="M154 150 h12 l-6 7 z" fill="#ff8fae"/>
      <path d="M160 157 q -8 9 -15 1" stroke="#c07a8c" stroke-width="3"
            stroke-linecap="round" fill="none"/>
      <path d="M160 157 q 8 9 15 1" stroke="#c07a8c" stroke-width="3"
            stroke-linecap="round" fill="none"/>

      <!-- 胡须 -->
      <g stroke="#e0b28f" stroke-width="2" stroke-linecap="round" opacity=".8">
        <path d="M100 138 h -24"/><path d="M100 148 l -24 6"/>
        <path d="M220 138 h 24"/><path d="M220 148 l 24 6"/>
      </g>

      <!-- 腮红 -->
      <ellipse cx="112" cy="152" rx="13" ry="8" fill="#ff9fbc" opacity=".45"/>
      <ellipse cx="208" cy="152" rx="13" ry="8" fill="#ff9fbc" opacity=".45"/>
    </svg>
  </div>

  <div class="bar-wrap">
    <div class="bar-label">开心值</div>
    <div class="bar"><div class="bar-fill" id="fill"></div></div>
    <div class="bar-label" id="pct">30%</div>
  </div>

  <div class="btns">
    <button class="btn" data-act="pet"><span class="ico">🖐️</span>摸摸头</button>
    <button class="btn" data-act="feed"><span class="ico">🐟</span>喂小鱼</button>
    <button class="btn" data-act="play"><span class="ico">🎾</span>玩球球</button>
    <button class="btn" data-act="sleep"><span class="ico">🌙</span>睡一会</button>
  </div>

  <div class="tip" id="tip">点一点小猫咪，它会开心哦 ~</div>
</div>

<div id="fx"></div>
<script>
(function () {
  const cat   = document.getElementById('cat');
  const say   = document.getElementById('say');
  const fill  = document.getElementById('fill');
  const pct   = document.getElementById('pct');
  const tip   = document.getElementById('tip');
  const fx    = document.getElementById('fx');
  const gift  = document.getElementById('gift');

  let happy = 30;
  let sleeping = false;
  let celebrated = false;

  /* ---------- 好感度 ---------- */
  function render() {
    happy = Math.max(0, Math.min(100, happy));
    fill.style.width = happy + '%';
    pct.textContent = Math.round(happy) + '%';
    if (happy >= 100) tip.textContent = '小猫咪超级超级喜欢你！❤️';
    else if (happy >= 70) tip.textContent = '它开始蹭你的手了 ~';
    else if (happy >= 40) tip.textContent = '它有点喜欢你啦 ~';
    else tip.textContent = '点一点小猫咪，它会开心哦 ~';
  }
  function addHappy(n) {
    happy += n;
    render();
    if (happy >= 100 && !celebrated) { celebrated = true; celebrate(); }
  }

  /* ---------- 说话 ---------- */
  let sayTimer = null;
  function talk(text, ms = 1600) {
    say.textContent = text;
    say.classList.add('show');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => say.classList.remove('show'), ms);
  }

  /* ---------- 音效（WebAudio，无需素材） ---------- */
  let ac = null;
  function ctx() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    return ac;
  }
  function purr() {
    try {
      const a = ctx(), o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
      o.type = 'sawtooth'; o.frequency.value = 62;
      g.gain.value = 0.045;
      lfo.frequency.value = 22; lg.gain.value = 0.035;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(a.destination);
      o.start(); lfo.start();
      setTimeout(() => { o.stop(); lfo.stop(); }, 620);
    } catch (e) {}
  }
  function meow() {
    try {
      const a = ctx(), o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle';
      const t = a.currentTime;
      o.frequency.setValueAtTime(620, t);
      o.frequency.exponentialRampToValueAtTime(880, t + 0.12);
      o.frequency.exponentialRampToValueAtTime(480, t + 0.34);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + 0.42);
    } catch (e) {}
  }

  /* ---------- 特效 ---------- */
  function heart(x, y, emoji) {
    const d = document.createElement('div');
    d.className = 'heart';
    d.textContent = emoji || ['❤️','💕','💖','🌸'][Math.floor(Math.random() * 4)];
    d.style.left = (x - 12) + 'px';
    d.style.top  = (y - 12) + 'px';
    d.style.fontSize = (18 + Math.random() * 14) + 'px';
    fx.appendChild(d);
    setTimeout(() => d.remove(), 1550);
  }
  function heartsBurst(n) {
    const r = cat.getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        heart(r.left + r.width * (0.25 + Math.random() * 0.5),
              r.top  + r.height * (0.3  + Math.random() * 0.4));
      }, i * 90);
    }
  }
  function celebrate() {
    const colors = ['#ff8fb1','#ffd166','#8fd3ff','#b9a7ff','#9ee6a6','#ff6b9d'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = (Math.random() * 0.9) + 's';
      c.style.animationDuration = (2 + Math.random() * 1.6) + 's';
      fx.appendChild(c);
      setTimeout(() => c.remove(), 4200);
    }
    talk('妈咪，我最最喜欢你啦！❤️', 3200);
    heartsBurst(12);
    meow();
  }
  function zzz() {
    const r = cat.getBoundingClientRect();
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        const z = document.createElement('div');
        z.className = 'zzz';
        z.textContent = 'z';
        z.style.left = (r.left + r.width * 0.62) + 'px';
        z.style.top  = (r.top + r.height * 0.22) + 'px';
        z.style.fontSize = (14 + i * 5) + 'px';
        fx.appendChild(z);
        setTimeout(() => z.remove(), 2500);
      }, i * 500);
    }
  }

  /* ---------- 动作 ---------- */
  const catLines = ['喵~ 好舒服', '咕噜咕噜~', '再摸摸嘛', '喵呜 ♪', '喜欢你喜欢你'];
  const feedLines = ['喵！小鱼干！', '好吃好吃~', '还想再吃一条', '谢谢你呀 ♡'];
  const playLines = ['球球！我抓到啦', '喵哈！再来一次', '好开心呀~'];
  const wakeLines = ['呼……我醒啦', '喵？（揉眼睛）'];

  function pet() {
    if (sleeping) { wake(); return; }
    cat.classList.add('petted');
    cat.classList.add('wave');
    purr(); heartsBurst(3);
    addHappy(8);
    talk(catLines[Math.floor(Math.random() * catLines.length)]);
    setTimeout(() => { cat.classList.remove('petted'); cat.classList.remove('wave'); }, 1100);
  }

  function feed() {
    if (sleeping) { wake(); return; }
    const r = cat.getBoundingClientRect();
    const f = document.createElement('div');
    f.className = 'heart';
    f.textContent = '🐟';
    f.style.left = (r.left + r.width * 0.1) + 'px';
    f.style.top  = (r.top + r.height * 0.55) + 'px';
    f.style.animationDuration = '.7s';
    fx.appendChild(f);
    setTimeout(() => f.remove(), 750);

    setTimeout(() => {
      cat.classList.add('petted');
      meow(); heartsBurst(2);
      addHappy(15);
      talk(feedLines[Math.floor(Math.random() * feedLines.length)]);
      setTimeout(() => cat.classList.remove('petted'), 1200);
    }, 620);
  }

  function play() {
    if (sleeping) { wake(); return; }
    const r = cat.getBoundingClientRect();
    const b = document.createElement('div');
    b.className = 'heart';
    b.textContent = '🎾';
    b.style.left = (r.left + r.width * 0.78) + 'px';
    b.style.top  = (r.top + r.height * 0.5) + 'px';
    b.style.animationDuration = '.6s';
    fx.appendChild(b);
    setTimeout(() => b.remove(), 650);

    setTimeout(() => {
      cat.classList.add('jump');
      addHappy(12);
      talk(playLines[Math.floor(Math.random() * playLines.length)]);
      meow();
      setTimeout(() => cat.classList.remove('jump'), 520);
    }, 500);
  }

  function sleep() {
    if (sleeping) { wake(); return; }
    sleeping = true;
    cat.classList.add('sleepy');
    talk('呼噜噜……晚安~', 2200);
    zzz();
    tip.textContent = '它睡着啦，摸摸它会醒哦 ~';
  }

  function wake() {
    sleeping = false;
    cat.classList.remove('sleepy');
    talk(wakeLines[Math.floor(Math.random() * wakeLines.length)]);
    addHappy(5);
    render();
  }

  /* ---------- 事件绑定 ---------- */
  cat.addEventListener('click', pet);
  document.querySelectorAll('.btn').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const a = b.dataset.act;
      if (a === 'pet') pet();
      else if (a === 'feed') feed();
      else if (a === 'play') play();
      else if (a === 'sleep') sleep();
    });
  });

  // 摸猫咪（点击任意位置也掉爱心）
  document.body.addEventListener('click', e => {
    if (gift.classList.contains('gone') && e.target.closest('#fx') === null) {
      if (!e.target.closest('.cat') && !e.target.closest('.btn')) {
        heart(e.clientX, e.clientY);
      }
    }
  });

  /* ---------- 开心值自然下降 ---------- */
  setInterval(() => {
    if (sleeping) return;
    happy -= 1;
    render();
  }, 2500);

  /* ---------- 拆礼物 ---------- */
  document.getElementById('openBtn').addEventListener('click', () => {
    gift.classList.add('gone');
    meow();
    setTimeout(() => { talk('喵~ 你终于来啦！', 2400); heartsBurst(5); }, 500);
    render();
  });

  render();
})();
</script>
</body>
</html>
